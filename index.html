<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reconciler · 데이터 브라우저</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%94%81%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --panel-2: #fbfcfd;
    --text: #1b2430;
    --muted: #667384;
    --border: #e3e8ee;
    --border-strong: #cfd7e1;
    --accent: #2563eb;
    --accent-weak: #eaf1fe;
    --code-bg: #f0f3f7;
    --code-text: #24405e;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.04);
  }
  :root[data-theme="dark"] {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #121820;
    --text: #e6edf3;
    --muted: #8b96a5;
    --border: #262d38;
    --border-strong: #333c49;
    --accent: #4f8cff;
    --accent-weak: #16233b;
    --code-bg: #1b2230;
    --code-text: #b8c7dc;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-2: #121820;
      --text: #e6edf3;
      --muted: #8b96a5;
      --border: #262d38;
      --border-strong: #333c49;
      --accent: #4f8cff;
      --accent-weak: #16233b;
      --code-bg: #1b2230;
      --code-text: #b8c7dc;
      --shadow: 0 1px 2px rgba(0,0,0,.3);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
          "Malgun Gothic", "Noto Sans KR", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, pre, .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

  /* ---- top bar ---- */
  .topbar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .brand h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  .brand .sub { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .brand .logo { font-size: 18px; }
  .controls { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .controls input[type="search"] {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border-strong); border-radius: 8px;
    padding: 7px 11px; font-size: 13px; width: 230px; max-width: 40vw;
  }
  .controls input[type="search"]:focus { outline: 2px solid var(--accent-weak); border-color: var(--accent); }
  .iconbtn {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border-strong); border-radius: 8px;
    height: 34px; min-width: 34px; padding: 0 9px; cursor: pointer; font-size: 15px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .iconbtn:hover { border-color: var(--accent); color: var(--accent); }
  .gh { font-size: 12px; }

  /* ---- view mode switch (진행 중 / 리뷰 대기 중 / 활성 전체 / 숨김) ---- */
  .modes {
    display: inline-flex; align-items: center; gap: 2px;
    background: var(--panel-2); border: 1px solid var(--border-strong);
    border-radius: 8px; padding: 2px;
  }
  .modes button {
    display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
    background: transparent; border: none; border-radius: 6px;
    height: 28px; padding: 0 10px; cursor: pointer;
    font: inherit; font-size: 12.5px; color: var(--muted);
  }
  .modes button:hover { color: var(--text); }
  .modes button[aria-pressed="true"] { background: var(--panel); color: var(--accent); font-weight: 700; box-shadow: var(--shadow); }
  .modes .n {
    font-size: 11px; line-height: 16px; min-width: 18px; text-align: center;
    padding: 0 5px; border-radius: 999px; background: var(--bg); color: var(--muted);
  }
  .modes button[aria-pressed="true"] .n { background: var(--accent-weak); color: var(--accent); }

  /* ---- 보기 대상 전환 (모델 / 템플릿) ---- */
  .views { border-color: var(--border); }
  .views button[aria-pressed="true"] { color: var(--text); }
  .views button[aria-pressed="true"] .n { background: var(--code-bg); color: var(--muted); }

  /* ---- 대상 레포 선택 ---- */
  .repo-filter { display: inline-flex; align-items: center; min-width: 0; }
  .repo-filter select {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border-strong); border-radius: 8px;
    height: 34px; padding: 0 8px; cursor: pointer;
    font: inherit; font-size: 12.5px;
    max-width: 210px; min-width: 0; text-overflow: ellipsis;
  }
  .repo-filter select:focus { outline: 2px solid var(--accent-weak); border-color: var(--accent); }
  .repo-filter.on select { border-color: var(--accent); color: var(--accent); font-weight: 700; }

  #statusbar { padding: 7px 18px; font-size: 12.5px; color: var(--muted); border-bottom: 1px solid var(--border); background: var(--panel-2); display: none; }
  #statusbar.show { display: block; }
  #statusbar.err { color: #d33; }

  /* ---- layout ---- */
  .layout { display: flex; flex: 1; min-height: 0; }
  .sidebar {
    width: 344px; flex-shrink: 0; overflow-y: auto;
    border-right: 1px solid var(--border); background: var(--panel-2);
    display: flex; flex-direction: column;
  }
  .detail { flex: 1; overflow-y: auto; padding: 22px 26px 60px; min-width: 0; }

  /* ---- sidebar list ---- */
  .list-head { padding: 12px 14px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
  .model-item {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: transparent; border: none; border-bottom: 1px solid var(--border);
    padding: 11px 14px; color: inherit;
  }
  .model-item:hover { background: var(--panel); }
  .model-item.active { background: var(--panel); box-shadow: inset 3px 0 0 var(--accent); }
  .model-item .mi-name { font-weight: 600; font-size: 13.5px; margin-bottom: 3px; display: flex; align-items: center; gap: 7px; }
  .model-item .mi-id { font-size: 11px; color: var(--muted); word-break: break-all; }
  .model-item .mi-meta { margin-top: 6px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .model-item .mi-sub { margin-top: 6px; font-size: 11.5px; color: var(--muted); }
  .model-item .mi-acted { margin-top: 6px; font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .model-item .mi-acted .acted-what { padding: 1px 6px; border-radius: 999px; background: var(--code-bg); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
  .taskcount { font-size: 11px; color: var(--muted); }
  .progpill { font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: #e0e7ff; color: #4338ca; }
  .manualpill { font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: #cffafe; color: #0e7490; }
  .hidepill { font-size: 10.5px; padding: 1px 7px; border-radius: 999px; background: var(--code-bg); color: var(--muted); }
  :root[data-theme="dark"] .progpill { background: #221f4d; color: #a5b4fc; }
  :root[data-theme="dark"] .manualpill { background: #083344; color: #67e8f9; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .progpill { background: #221f4d; color: #a5b4fc; }
    :root:not([data-theme="light"]) .manualpill { background: #083344; color: #67e8f9; }
  }

  .legend { margin-top: auto; border-top: 1px solid var(--border); padding: 10px 14px; font-size: 12px; color: var(--muted); }
  .legend summary { cursor: pointer; font-weight: 600; }
  .legend .row { display: flex; align-items: center; gap: 7px; margin-top: 7px; }

  /* ---- detail ---- */
  .empty { color: var(--muted); text-align: center; padding: 60px 20px; }
  .m-header h2 { margin: 0 0 4px; font-size: 21px; letter-spacing: -0.02em; }
  .m-header .m-id { font-size: 12.5px; color: var(--muted); }
  .m-desc { margin: 12px 0 4px; max-width: 82ch; color: var(--text); }
  .m-dates { color: var(--muted); font-size: 12px; margin-top: 8px; display: flex; gap: 16px; flex-wrap: wrap; }

  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .tag { font-size: 11.5px; background: var(--accent-weak); color: var(--accent); border-radius: 6px; padding: 2px 8px; font-weight: 500; }
  .chip { font-size: 11px; border: 1px solid var(--border-strong); border-radius: 6px; padding: 1px 7px; color: var(--muted); background: var(--panel-2); }
  .chip.side { text-transform: uppercase; letter-spacing: .03em; }
  a.chip.prchip { color: var(--accent); border-color: var(--accent); background: var(--accent-weak); font-weight: 600; text-decoration: none; }
  a.chip.prchip:hover { text-decoration: underline; }

  .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; margin: 26px 0 10px; }
  .section-title.with-toggle { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  /* ---- 작업 목록 필터 토글 (조치 필요만) ---- */
  .toggle {
    margin-left: auto; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    background: var(--panel-2); color: var(--muted);
    border: 1px solid var(--border-strong); border-radius: 999px;
    height: 28px; padding: 0 11px; cursor: pointer;
    font: inherit; font-size: 11.5px; font-weight: 700; letter-spacing: .02em; text-transform: none;
  }
  .toggle:hover { color: var(--text); border-color: var(--accent); }
  .toggle[aria-pressed="true"] { background: var(--accent-weak); color: var(--accent); border-color: var(--accent); }
  .toggle .n {
    font-size: 11px; line-height: 16px; min-width: 18px; text-align: center;
    padding: 0 5px; border-radius: 999px; background: var(--bg); color: var(--muted); font-weight: 700;
  }
  .toggle[aria-pressed="true"] .n { background: var(--panel); color: var(--accent); }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
  .state-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 720px) { .state-grid { grid-template-columns: 1fr; } }
  .tracked { padding: 14px 16px; }
  .tracked-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .tracked-label { font-weight: 700; font-size: 13px; letter-spacing: .02em; }
  .tracked-label.tobe { color: var(--accent); }
  .tracked-label.asis { color: #c2410c; }
  :root[data-theme="dark"] .tracked-label.asis { color: #fb923c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tracked-label.asis { color: #fb923c; } }
  .src { font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .src-type { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; background: var(--code-bg); color: var(--muted); border-radius: 4px; padding: 1px 6px; font-weight: 700; }
  .kv { display: grid; grid-template-columns: 92px 1fr; gap: 6px; font-size: 12.5px; padding: 3px 0; }
  .kv > span:first-child { color: var(--muted); }
  .ver { background: var(--code-bg); color: var(--code-text); border-radius: 5px; padding: 1px 6px; font-size: 12px; word-break: break-all; }
  .checkpolicy { padding: 10px 16px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--muted); display: flex; gap: 18px; flex-wrap: wrap; }

  details.block { margin-top: 10px; }
  details.block > summary, details.script > summary, details.raw > summary, details.sec > summary {
    cursor: pointer; list-style: none; user-select: none;
  }
  details > summary::-webkit-details-marker { display: none; }
  details.block > summary {
    font-weight: 600; font-size: 13px; padding: 10px 14px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; display: flex; align-items: center; gap: 8px;
  }
  details.block[open] > summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  details.block > summary::before { content: "▸"; color: var(--muted); font-size: 11px; }
  details.block[open] > summary::before { content: "▾"; }
  details.block > .block-body { border: 1px solid var(--border); border-top: none; border-radius: 0 0 10px 10px; padding: 4px 16px 14px; background: var(--panel); }

  .script summary { font-size: 12px; color: var(--muted); padding: 6px 0; display: inline-flex; align-items: center; gap: 7px; }
  .script summary::before { content: "▸"; font-size: 10px; }
  details.script[open] > summary::before { content: "▾"; }

  pre.code { background: var(--code-bg); color: var(--code-text); border-radius: 8px; padding: 12px 14px; overflow-x: auto; font-size: 12px; line-height: 1.5; margin: 8px 0; }
  pre.code code { white-space: pre; }

  /* ---- tasks ---- */
  .task { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow); margin-bottom: 14px; overflow: hidden; }
  .task-head { display: flex; align-items: center; gap: 9px; padding: 12px 15px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
  .task-id { font-size: 12px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
  .task-head .spacer { flex: 1; }
  .task-trigger { padding: 9px 15px; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid var(--border); background: var(--panel-2); }
  .task-body { padding: 6px 15px 12px; }

  details.sec { border-bottom: 1px solid var(--border); }
  details.sec:last-child { border-bottom: none; }
  details.sec > summary { padding: 10px 2px; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px; }
  details.sec > summary::before { content: "▸"; color: var(--muted); font-size: 11px; }
  details.sec[open] > summary::before { content: "▾"; }
  .sec-body { padding: 2px 2px 14px; }

  .badge { border-radius: 999px; padding: 2px 10px; font-size: 11.5px; font-weight: 700; color: #fff; white-space: nowrap; letter-spacing: .01em; }
  .b-unknown { background: #64748b; }
  .b-assessing { background: #3b82f6; }
  .b-no_action_needed { background: #0ea5a4; }
  .b-action_required { background: #f97316; color: #3a1c00; }
  .b-planning { background: #8b5cf6; }
  .b-planned { background: #0ea5e9; color: #04283a; }
  .b-review_rejected { background: #c026d3; }
  .b-approved { background: #22d3ee; color: #04303a; }
  .b-reviewing { background: #a3e635; color: #1a2e05; }
  .b-executing { background: #6366f1; }
  .b-verifying { background: #14b8a6; color: #04302c; }
  .b-succeeded { background: #16a34a; }
  .b-failed { background: #ef4444; }
  .b-cancelled { background: #94a3b8; color: #1b2430; }

  .pill { border-radius: 999px; padding: 1px 9px; font-size: 11px; font-weight: 600; border: 1px solid var(--border-strong); }
  .pill.yes { color: #b91c1c; border-color: #f0b4b4; background: #fdecec; }
  .pill.no { color: #15803d; border-color: #b7e0c4; background: #eafaf0; }
  :root[data-theme="dark"] .pill.yes { color: #fca5a5; border-color: #5b2626; background: #2a1414; }
  :root[data-theme="dark"] .pill.no { color: #86efac; border-color: #24503a; background: #10241a; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .pill.yes { color: #fca5a5; border-color: #5b2626; background: #2a1414; }
    :root:not([data-theme="light"]) .pill.no { color: #86efac; border-color: #24503a; background: #10241a; }
  }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
  .grid2 h5, .gap h5 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .gap { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border-strong); }
  .steps { margin: 8px 0; padding-left: 20px; }
  .steps li { margin-bottom: 7px; }
  .meta { margin-top: 10px; }
  .small { font-size: 11.5px; }
  .muted { color: var(--muted); }

  ol.checks, ul.entries { margin: 8px 0; padding-left: 18px; }
  ol.checks li, ul.entries li { margin-bottom: 5px; }

  /* ---- markdown prose ---- */
  .prose { font-size: 13px; }
  .prose > *:first-child { margin-top: 0; }
  .prose h1 { font-size: 17px; margin: 14px 0 8px; }
  .prose h2 { font-size: 15px; margin: 16px 0 7px; padding-bottom: 3px; border-bottom: 1px solid var(--border); }
  .prose h3 { font-size: 13.5px; margin: 14px 0 6px; }
  .prose h4, .prose h5, .prose h6 { font-size: 12.5px; margin: 12px 0 5px; color: var(--muted); }
  .prose p { margin: 7px 0; }
  .prose ul, .prose ol { margin: 7px 0; padding-left: 22px; }
  .prose li { margin: 3px 0; }
  .prose code { background: var(--code-bg); color: var(--code-text); border-radius: 4px; padding: 1px 5px; font-size: 12px; }
  .prose pre.code code { background: none; padding: 0; }
  .prose blockquote { margin: 8px 0; padding: 2px 12px; border-left: 3px solid var(--border-strong); color: var(--muted); }
  .prose hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .prose strong { font-weight: 700; }
  .prose a { word-break: break-word; }
  .prose table { border-collapse: collapse; margin: 10px 0; font-size: 12.5px; display: block; max-width: 100%; overflow-x: auto; }
  .prose th, .prose td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
  .prose th { background: var(--panel-2); font-weight: 700; white-space: nowrap; }
  .prose tbody tr:nth-child(even) td { background: var(--panel-2); }

  /* ---- 템플릿 본문 카드 ---- */
  .doc-card { padding: 6px 20px 18px; }
  .doc-empty { padding: 28px 20px; color: var(--muted); }

  details.raw { margin-top: 26px; }
  details.raw > summary { font-size: 12px; color: var(--muted); cursor: pointer; padding: 6px 0; display: inline-flex; gap: 7px; align-items: center; }
  details.raw > summary::before { content: "▸"; font-size: 10px; }
  details.raw[open] > summary::before { content: "▾"; }

  @media (max-width: 820px) {
    .topbar { flex-wrap: wrap; row-gap: 8px; max-width: 100%; }
    .controls { margin-left: 0; width: 100%; min-width: 0; flex-wrap: wrap; }
    /* 좁은 화면에서 상태(보기 모드) 버튼 묶음이 화면 폭을 넘겨 가로 스크롤을 만들지 않도록,
       한 줄을 통째로 쓰고 넘치는 버튼은 다음 줄로 접는다. */
    .controls .modes { flex: 1 1 100%; max-width: 100%; min-width: 0; flex-wrap: wrap; row-gap: 2px; }
    .controls .modes button { flex: 1 1 auto; min-width: 0; padding: 0 8px; justify-content: center; }
    .controls .views { flex: 0 1 auto; }
    .repo-filter { flex: 1 1 150px; }
    .repo-filter select { width: 100%; max-width: none; }
    .controls input[type="search"] { flex: 1; min-width: 140px; max-width: none; width: auto; }
    .layout { flex-direction: column; }
    .sidebar { width: auto; max-height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
    .detail { padding: 18px 16px 50px; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🔁</span>
      <h1>reconciler</h1>
      <span class="sub" id="brandsub">데이터 브라우저 · <code>data/</code></span>
    </div>
    <div class="controls">
      <div class="modes views" id="views" role="group" aria-label="보기 대상"></div>
      <div class="repo-filter" id="repofilter">
        <select id="repo" aria-label="대상 레포"></select>
      </div>
      <div class="modes" id="modes" role="group" aria-label="보기 모드"></div>
      <input id="search" type="search" placeholder="이름·id·태그 검색…" autocomplete="off" spellcheck="false">
      <a id="ghlink" class="iconbtn gh" title="GitHub에서 보기" target="_blank" rel="noopener" style="display:none">GitHub ↗</a>
      <button id="reload" class="iconbtn" title="새로고침">↻</button>
      <button id="theme" class="iconbtn" title="테마 전환">🌓</button>
    </div>
  </header>
  <div id="statusbar"></div>
  <main class="layout">
    <aside class="sidebar">
      <div class="list-head"><span id="listhead">ToBeModels</span> (<span id="modelcount">0</span>)</div>
      <div id="modellist"></div>
      <details class="legend" id="legend">
        <summary>상태 범례</summary>
        <div id="legendbody"></div>
      </details>
    </aside>
    <section class="detail" id="detail">
      <div class="empty">데이터를 불러오는 중…</div>
    </section>
  </main>

<script>
"use strict";
(function () {
  var STATUS_META = {
    assessing:        { label: "판단 중",     cls: "b-assessing",      color: "#3b82f6" },
    no_action_needed: { label: "조치 불필요", cls: "b-no_action_needed", color: "#0ea5a4" },
    action_required:  { label: "계획 대기",   cls: "b-action_required", color: "#f97316" },
    planning:         { label: "계획 중",     cls: "b-planning",       color: "#8b5cf6" },
    planned:          { label: "검토 판단 대기", cls: "b-planned",      color: "#0ea5e9" },
    reviewing:        { label: "검토 판단 중", cls: "b-reviewing",      color: "#a3e635" },
    review_rejected:  { label: "검토 반려",   cls: "b-review_rejected", color: "#c026d3" },
    approved:         { label: "실행 대기",   cls: "b-approved",       color: "#22d3ee" },
    executing:        { label: "실행 중",     cls: "b-executing",      color: "#6366f1" },
    verifying:        { label: "검증 중",     cls: "b-verifying",      color: "#14b8a6" },
    succeeded:        { label: "성공",        cls: "b-succeeded",      color: "#16a34a" },
    failed:           { label: "실패",        cls: "b-failed",         color: "#ef4444" },
    cancelled:        { label: "취소됨",      cls: "b-cancelled",      color: "#94a3b8" }
  };

  // 사이드바 보기 모드. state.models 는 숨김 모델까지 포함한 전체 목록이고,
  // 실제로 목록에 노출되는 집합은 여기서 정한다. 기본값은 "progress"(진행 중).
  //
  // 진행 중 = 아직 끝나지 않은 작업이 있는 모델. 진행 중 상태를 나열하지 않고 "완료"만 빼는
  // 방식으로 정의한다 — 스키마에 새 진행 상태가 생겨도 페이지 수정 없이 진행 중에 잡혀,
  // 목록에서 조용히 사라지는 일이 없게 하기 위해서다.
  // 완료 = 워크플로가 더 이상 집어가지 않는 종료 상태. failed·review_rejected는 planner가
  // 다시 집는 재작업 진입점이므로 완료가 아니라 진행 중이다.
  //
  // 리뷰 대기 중 = 사람의 승인을 기다리는 작업이 있는 모델. 진행 중의 부분집합이다.
  // 사람 승인은 수동 승인 대기 하나뿐이다 — status는 approved(실행 대기)지만 마지막 시도의
  // review.manualApproval이 있으면, 대상 레포의 사람 승인 status가 붙기 전까지 실행되지 않는다.
  // 승인 status가 붙었는지는 GitHub에서만 알 수 있으므로 페이지는 확인하지 않는다 — 실행되어
  // approved를 벗어나면 탭에서 빠진다. 상태만으로는 가려지지 않아 task 단위로 판정한다.
  var DONE_STATUSES = ["succeeded", "cancelled", "no_action_needed"];
  var MODES = [
    { id: "progress", label: "진행 중",      head: "진행 중 모델",      hint: "완료(" + DONE_STATUSES.join("/") + ")되지 않은 작업이 있는 모델만",
      empty: "진행 중인 작업이 없습니다." },
    { id: "review",   label: "리뷰 대기 중", head: "리뷰 대기 중 모델", hint: "대상 레포의 사람 승인을 기다리는(수동 승인 대기 approved) 작업이 있는 모델만",
      empty: "리뷰를 기다리는 작업이 없습니다." },
    { id: "active",   label: "활성 전체",    head: "ToBeModels",        hint: "감지가 활성인 모델 전체",
      empty: "감지 활성 모델이 없습니다." },
    { id: "hidden",   label: "숨김",         head: "숨김 모델",          hint: "감지 비활성(숨김) 모델만",
      empty: "숨겨진 모델이 없습니다." }
  ];
  var DEFAULT_MODE = "progress";

  // 사이드바가 무엇의 목록인지 — 운영 데이터(모델)냐, 모델을 찍어내는 템플릿이냐.
  var VIEWS = [
    { id: "models",    label: "모델",   hint: "data/의 ToBeModel과 정합성 작업" },
    { id: "templates", label: "템플릿", hint: "templates/의 ToBeModel 유형 템플릿" }
  ];
  var DEFAULT_VIEW = "models";

  var state = {
    models: [], tasksByModel: {}, selected: null, filter: "",
    mode: DEFAULT_MODE,
    // 사용자가 모드를 직접 고르면 localStorage에 저장해 새로고침해도 유지한다.
    // (init()에서 저장값을 읽어 mode/modePinned를 채운다.)
    modePinned: false,
    repo: "",           // 대상 레포 필터. ""(빈 문자열) = 전체 레포. 역시 저장·복원된다.
    // 상세의 작업 목록을 "조치 필요"(taskNeedsAction)인 것만으로 좁히는 토글. 모델을 옮겨도,
    // 새로고침해도 유지된다 — 조치가 밀린 건을 훑는 동안 모델마다 다시 켜지 않게.
    tasksActionOnly: false,
    view: DEFAULT_VIEW,
    templates: null,        // README 표 파싱 결과 (null = 아직 안 불러옴)
    templatesError: null,
    templateBodies: {},     // file -> { text } | { error }
    selectedTemplate: null
  };

  var $ = function (s, el) { return (el || document).querySelector(s); };

  // ---------- helpers ----------
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function renderInline(s) {
    // s is already HTML-escaped
    s = s.replace(/`([^`]+)`/g, function (m, c) { return "<code>" + c + "</code>"; });
    s = s.replace(/\*\*([^*]+?)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, t, u) {
      return '<a href="' + u + '" target="_blank" rel="noopener">' + t + "</a>";
    });
    return s;
  }

  // Compact, self-contained markdown renderer covering the constructs used in this data:
  // headings, bold, inline code, fenced code, ordered/unordered lists (1 level of nesting),
  // blockquotes, horizontal rules, links, pipe tables, and paragraphs.
  // (Tables carry the substance of the templates — slot tables, the template index,
  //  the shared-defaults table — so they must render as tables, not as raw pipes.)
  function md(src) {
    if (src == null || src === "") return "";
    var lines = String(src).replace(/\r\n?/g, "\n").split("\n");
    var out = [];
    var i = 0;
    var para = [];

    function flushPara() {
      if (para.length) {
        out.push("<p>" + renderInline(escapeHtml(para.join(" "))) + "</p>");
        para = [];
      }
    }

    // A pipe table is a header row, a delimiter row (|---|---|), then body rows.
    function isTableRow(l) { return l != null && /^\s*\|.*\|\s*$/.test(l); }
    function isDelimiterRow(l) { return isTableRow(l) && /^[\s|:-]+$/.test(l) && l.indexOf("-") !== -1; }

    // Split on unescaped pipes only, so a cell may contain a literal "\|".
    function splitRow(l) {
      var body = l.trim().replace(/^\|/, "").replace(/\|$/, "");
      var cells = [];
      var cur = "";
      for (var k = 0; k < body.length; k++) {
        var ch = body.charAt(k);
        if (ch === "\\" && body.charAt(k + 1) === "|") { cur += "|"; k++; continue; }
        if (ch === "|") { cells.push(cur.trim()); cur = ""; continue; }
        cur += ch;
      }
      cells.push(cur.trim());
      return cells;
    }

    function parseTable() {
      var head = splitRow(lines[i]);
      i += 2;   // skip header + delimiter
      var html = "<table><thead><tr>" + head.map(function (c) {
        return "<th>" + renderInline(escapeHtml(c)) + "</th>";
      }).join("") + "</tr></thead><tbody>";
      while (i < lines.length && isTableRow(lines[i]) && !isDelimiterRow(lines[i])) {
        html += "<tr>" + splitRow(lines[i]).map(function (c) {
          return "<td>" + renderInline(escapeHtml(c)) + "</td>";
        }).join("") + "</tr>";
        i++;
      }
      return html + "</tbody></table>";
    }

    function parseList() {
      var baseIndent = lines[i].match(/^(\s*)/)[1].length;
      var ordered = /^\s*\d+[.)]\s+/.test(lines[i]);
      var html = ordered ? "<ol>" : "<ul>";
      while (i < lines.length) {
        var l = lines[i];
        if (/^\s*$/.test(l)) break;
        var m = l.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        if (!m) break;
        var indent = m[1].length;
        if (indent < baseIndent) break;
        if (indent > baseIndent) {
          var nested = parseList();
          html = html.replace(/<\/li>\s*$/, nested + "</li>");
          continue;
        }
        var itemOrdered = /^\d+[.)]$/.test(m[2]);
        if (itemOrdered !== ordered) break;
        html += "<li>" + renderInline(escapeHtml(m[3])) + "</li>";
        i++;
      }
      html += ordered ? "</ol>" : "</ul>";
      return html;
    }

    while (i < lines.length) {
      var line = lines[i];
      var fence = line.match(/^\s*```(.*)$/);
      if (fence) {
        flushPara();
        var code = [];
        i++;
        while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) { code.push(lines[i]); i++; }
        i++;
        out.push('<pre class="code"><code>' + escapeHtml(code.join("\n")) + "</code></pre>");
        continue;
      }
      if (/^\s*$/.test(line)) { flushPara(); i++; continue; }
      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) { flushPara(); var lv = h[1].length; out.push("<h" + lv + ">" + renderInline(escapeHtml(h[2].trim())) + "</h" + lv + ">"); i++; continue; }
      if (/^\s*([-*_])\1{2,}\s*$/.test(line)) { flushPara(); out.push("<hr>"); i++; continue; }
      if (/^\s*>\s?/.test(line)) {
        flushPara();
        var q = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])) { q.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
        out.push("<blockquote>" + md(q.join("\n")) + "</blockquote>");
        continue;
      }
      if (isTableRow(line) && isDelimiterRow(lines[i + 1])) { flushPara(); out.push(parseTable()); continue; }
      if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) { flushPara(); out.push(parseList()); continue; }
      para.push(line.trim());
      i++;
    }
    flushPara();
    return out.join("\n");
  }

  function fmtDate(iso) {
    if (!iso) return '<span class="muted">—</span>';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return escapeHtml(iso);
    return '<time datetime="' + escapeHtml(iso) + '" title="' + escapeHtml(iso) + '">' + escapeHtml(d.toLocaleString()) + "</time>";
  }

  // 목록에서는 절대시각보다 "얼마나 묵었는지"가 먼저 필요하다. 정확한 시각은 title로 함께 준다.
  function relTime(iso, now) {
    var t = Date.parse(iso);
    if (isNaN(t)) return "";
    var diff = Math.floor(((now == null ? Date.now() : now) - t) / 1000);
    if (diff < 60) return "방금";
    if (diff < 3600) return Math.floor(diff / 60) + "분 전";
    if (diff < 86400) return Math.floor(diff / 3600) + "시간 전";
    if (diff < 86400 * 30) return Math.floor(diff / 86400) + "일 전";
    if (diff < 86400 * 365) return Math.floor(diff / (86400 * 30)) + "개월 전";
    return Math.floor(diff / (86400 * 365)) + "년 전";
  }

  function fmtVersion(v) {
    if (v == null) return '<span class="muted">null · 미관측</span>';
    var short = String(v).replace(/\b([0-9a-f]{7,40})\b/gi, function (m) { return m.length >= 10 ? m.slice(0, 10) : m; });
    return '<code class="ver" title="' + escapeHtml(v) + '">' + escapeHtml(short) + "</code>";
  }

  function fmtDataSource(ds) {
    if (!ds) return "";
    if (ds.type === "github") {
      var url = "https://github.com/" + ds.repository;
      if (ds.subPath) url += "/tree/" + (ds.ref || "main") + "/" + ds.subPath;
      else if (ds.ref) url += "/tree/" + ds.ref;
      return '<span class="src"><span class="src-type">github</span>' +
             ' <a href="' + escapeHtml(url) + '" target="_blank" rel="noopener">' + escapeHtml(ds.repository) + "</a>" +
             (ds.ref ? ' <span class="chip">@' + escapeHtml(ds.ref) + "</span>" : "") +
             (ds.subPath ? " <code>" + escapeHtml(ds.subPath) + "</code>" : "") + "</span>";
    }
    if (ds.type === "kubernetes_deployment") {
      return '<span class="src"><span class="src-type">k8s</span> ' +
             (ds.cluster ? escapeHtml(ds.cluster) + " / " : "") +
             escapeHtml(ds.namespace) + " / <code>" + escapeHtml(ds.name) + "</code></span>";
    }
    if (ds.type === "monitor_alert") {
      return '<span class="src"><span class="src-type">monitor</span> ' + escapeHtml(ds.provider) +
             " <code>" + escapeHtml(ds.monitorId) + "</code></span>";
    }
    if (ds.type === "custom") {
      return '<span class="src"><span class="src-type">custom</span> ' + escapeHtml(ds.description || "") + "</span>";
    }
    return '<span class="src">' + escapeHtml(ds.type || "?") + "</span>";
  }

  function fmtTracked(label, cls, ts) {
    if (!ts) return "";
    var scriptHtml = "";
    if (ts.versionScript) {
      scriptHtml =
        '<details class="script"><summary>version script <span class="chip">' + escapeHtml(ts.versionScript.runtime) + "</span>" +
        (ts.versionScript.timeoutSeconds ? ' <span class="muted small">timeout ' + ts.versionScript.timeoutSeconds + "s</span>" : "") +
        '</summary><pre class="code"><code>' + escapeHtml(ts.versionScript.code || "") + "</code></pre></details>";
    }
    return '<div class="tracked">' +
      '<div class="tracked-head"><span class="tracked-label ' + cls + '">' + label + "</span> " + fmtDataSource(ts.dataSource) + "</div>" +
      '<div class="kv"><span>버전</span><span>' + fmtVersion(ts.lastObservedVersion) + "</span></div>" +
      '<div class="kv"><span>관측 시각</span><span>' + fmtDate(ts.lastObservedAt) + "</span></div>" +
      scriptHtml + "</div>";
  }

  function statusBadge(status) {
    var m = STATUS_META[status] || { label: status || "?", cls: "b-unknown" };
    return '<span class="badge ' + m.cls + '" title="' + escapeHtml(status || "") + '">' + escapeHtml(m.label) + "</span>";
  }

  function fmtTriggerVersions(trig) {
    var parts = [];
    function side(name, obj) {
      if (!obj) return;
      var prev = obj.previousVersion == null ? "∅" : shorten(obj.previousVersion);
      var cur = shorten(obj.currentVersion);
      parts.push('<span class="chip" title="' + escapeHtml((obj.previousVersion || "null") + " → " + obj.currentVersion) + '">' +
        name + ": " + escapeHtml(prev) + " → " + escapeHtml(cur) + "</span>");
    }
    side("as-is", trig.asIs);
    side("to-be", trig.toBe);
    return parts.join(" ");
  }

  function shorten(v) {
    if (v == null) return "∅";
    return String(v).replace(/\b([0-9a-f]{7,40})\b/gi, function (m) { return m.slice(0, 7); });
  }

  // ---------- PR link helpers (attempts[].preparation.pullRequestUrl) ----------
  function prShortLabel(url) {
    var m = String(url).match(/\/pull\/(\d+)(?:[/?#]|$)/);
    return m ? "#" + m[1] : "링크";
  }

  function prFullLabel(url) {
    var m = String(url).match(/github\.com\/([^\/]+\/[^\/]+)\/pull\/(\d+)/);
    if (m) return m[1] + "#" + m[2];
    return String(url).replace(/^https?:\/\//, "");
  }

  function fmtPrLink(url) {
    if (!url) return '<span class="muted">없음 · 직접 액션</span>';
    return '<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener" title="' + escapeHtml(url) + '">' +
      escapeHtml(prFullLabel(url)) + " ↗</a>";
  }

  // 마지막(현재) 시도부터 거슬러 올라가 가장 최근 PR 링크를 찾는다.
  function latestPrUrl(t) {
    var arr = t.attempts || [];
    for (var i = arr.length - 1; i >= 0; i--) {
      var p = arr[i] && arr[i].preparation;
      if (p && p.pullRequestUrl) return p.pullRequestUrl;
    }
    return null;
  }

  // 작업 식별자는 모델 안에서만 유일하므로(rct_<날짜>-<연번>), 화면에는 소속 모델을
  // 앞에 붙인 <toBeModelId>-<task id> 형태로 보여준다. 다른 모델의 같은 번호와 헷갈리지
  // 않고, 그대로 복사해 붙이면 어느 모델의 작업인지가 함께 전달된다.
  // toBeModelId가 없는(예전) 레코드는 task id만 그대로 쓴다.
  function taskDisplayId(t) {
    if (!t) return "";
    return (t.toBeModelId ? t.toBeModelId + "-" : "") + t.id;
  }

  function sec(title, sub, bodyHtml, open) {
    return '<details class="sec"' + (open ? " open" : "") + "><summary>" + escapeHtml(title) +
      (sub ? ' <span class="muted small">' + sub + "</span>" : "") + '</summary><div class="sec-body">' + bodyHtml + "</div></details>";
  }

  // 조치 pill 은 **status** 만으로 정한다. 판정 결과는 detector 가 status 전이
  // (assessing → no_action_needed | action_required)로 남기고, 계획·실행 경로의 모든 상태는
  // action_required 를 거쳐야만 도달하므로 "종료가 아닌 판정 후 상태 = 조치 필요"가 성립한다.
  // (예전에는 `assessment.actionRequired` 를 읽었지만 status 와 중복이라 스키마에서 뺐다.)
  //
  // 종료 상태(DONE_STATUSES)에서는 pill 을 그리지 않는다. "조치 필요"는 현재형으로 읽혀서,
  // 끝난 task 에 붙여 두면 완료된 작업이 남은 할 일처럼 보이기 때문이다. `failed`/`review_rejected`
  // 는 planner 가 다시 집는 재작업 진입점이라 종료가 아니므로 pill 을 유지한다.
  //
  // "조치 필요"의 정의는 pill 과 목록 필터가 함께 쓴다 — 토글로 걸러낸 목록이 pill 이 붙은
  // task 집합과 정확히 같아야 "조치 필요만"이라는 라벨이 거짓말이 되지 않기 때문이다.
  // 그래서 판정을 여기 한 번만 적고 양쪽이 이 함수를 부른다.
  //
  // 아직 판단 전인 `assessing` task 도 조치 필요로 본다. "판정 없음"은 "조치가 필요 없다"가
  // 아니라 아직 아무도 결론을 내지 않았다는 뜻이고, 그런 건을 빼면 판단 단계에서 멈춰 선 task 가
  // 조치 필요만 보기에서 통째로 사라진다 — 가장 손이 필요한 건이 가장 안 보이게 된다.
  function taskNeedsAction(t) {
    if (!t) return false;
    return DONE_STATUSES.indexOf(t.status) === -1;
  }

  function actionPillHtml(t) {
    if (!taskNeedsAction(t)) return "";
    // 판정 전 건에는 근거를 툴팁으로 달아 둔다 — 같은 pill 이라도 기록된 판정이 아니라
    // 판정이 아직 없어서 붙은 것임을 상세를 열지 않고도 알 수 있게. 재확인 유예로 파킹된
    // 건은 언제 다시 판정하는지를 함께 적는다.
    var title = "";
    if (t.status === "assessing") {
      var recheck = t.assessment && t.assessment.recheckAfter;
      title = recheck
        ? "재확인 대기 — " + recheck + " 이후 다시 판정합니다"
        : "아직 판단 전 — 판정이 나올 때까지 조치 필요로 둡니다";
    }
    return '<span class="pill yes"' + (title ? ' title="' + title + '"' : "") + ">조치 필요</span>";
  }

  // 바뀐 쪽은 따로 기록하지 않는다 — 각 side의 previousVersion≠currentVersion에서 도출한다(단일 진실 공급원).
  function changedSides(trig) {
    var out = [];
    [["as_is", "asIs"], ["to_be", "toBe"]].forEach(function (p) {
      var vc = trig && trig[p[1]];
      if (vc && vc.previousVersion !== vc.currentVersion) out.push(p[0]);
    });
    return out;
  }

  function fmtTask(t) {
    var trig = t.trigger || {};
    var sides = changedSides(trig).map(function (s) {
      return '<span class="chip side">' + (s === "as_is" ? "as-is" : "to-be") + "</span>";
    }).join(" ");
    // 수동 트리거는 바뀐 쪽이 없을 수 있다 — "변경: —"로 두면 감지가 헛돈 것처럼 보이므로 계기를 그대로 적는다.
    var triggerLabel = trig.source === "manual"
      ? '<span class="chip side">수동 트리거</span>' + (sides ? " " + sides : "")
      : "변경: " + (sides || "—");
    // 수동 트리거는 사유가 곧 계기다. 없으면 왜 열렸는지 레코드 어디에도 남지 않으므로 여기 그대로 보여준다.
    var triggerReason = (trig.source === "manual" && trig.reason)
      ? ' <span class="muted">— ' + escapeHtml(trig.reason) + "</span>"
      : "";

    var actionPill = actionPillHtml(t);

    var sections = "";

    if (t.stateSummary) {
      var ss = t.stateSummary;
      var body =
        '<div class="grid2"><div><h5>as-is</h5><div class="prose">' + md(ss.asIs) + "</div></div>" +
        '<div><h5>to-be</h5><div class="prose">' + md(ss.toBe) + "</div></div></div>" +
        (ss.gap ? '<div class="gap"><h5>gap</h5><div class="prose">' + md(ss.gap) + "</div></div>" : "") +
        (ss.summarizedAt ? '<div class="meta small muted">요약 ' + fmtDate(ss.summarizedAt) + "</div>" : "");
      sections += sec("상태 요약", "state summary", body);
    }

    if (t.assessment) {
      var a = t.assessment;
      var abody =
        (a.reason ? '<div class="prose">' + md(a.reason) + "</div>" : "") +
        (a.recheckAfter ? '<div class="kv" style="margin-top:8px"><span>재확인</span><span>' + fmtDate(a.recheckAfter) + "</span></div>" : "") +
        '<div class="meta small muted">' + fmtDate(a.assessedAt) + "</div>";
      sections += sec("판단", "assessment", abody);
    }

    (t.attempts || []).forEach(function (at, ai, arr) {
      var atag = arr.length > 1 ? " · 시도 " + (ai + 1) + "/" + arr.length : "";

      if (at.plan) {
        var p = at.plan;
        var steps = (p.steps || []).map(function (s) {
          return "<li><b>#" + s.seq + "</b> " + escapeHtml(s.action) +
            (s.expectedOutcome ? '<div class="muted small">→ ' + escapeHtml(s.expectedOutcome) + "</div>" : "") + "</li>";
        }).join("");
        var pbody =
          (p.summary ? '<div class="prose">' + md(p.summary) + "</div>" : "") +
          "<ol class=\"steps\">" + steps + "</ol>" +
          '<div class="meta small muted">' + (p.riskLevel ? "risk: " + escapeHtml(p.riskLevel) + " · " : "") + fmtDate(p.plannedAt) + "</div>";
        sections += sec("계획" + atag, "plan" + (p.riskLevel ? " · risk " + p.riskLevel : "") +
          (at.reason ? " · after " + escapeHtml(at.reason) : ""), pbody);
      }

      if (at.preparation) {
        var pp = at.preparation;
        var repoUrl = pp.repository ? "https://github.com/" + pp.repository : null;
        var branchUrl = repoUrl && pp.branch ? repoUrl + "/tree/" + pp.branch : null;
        var ppbody =
          (pp.repository ? '<div class="kv"><span>레포</span><span>' +
            (repoUrl ? '<a href="' + escapeHtml(repoUrl) + '" target="_blank" rel="noopener">' + escapeHtml(pp.repository) + "</a>"
                     : escapeHtml(pp.repository)) + "</span></div>" : "") +
          (pp.branch ? '<div class="kv"><span>브랜치</span><span>' +
            (branchUrl ? '<a href="' + escapeHtml(branchUrl) + '" target="_blank" rel="noopener"><code>' + escapeHtml(pp.branch) + "</code></a>"
                       : "<code>" + escapeHtml(pp.branch) + "</code>") + "</span></div>" : "") +
          '<div class="kv"><span>PR</span><span>' + fmtPrLink(pp.pullRequestUrl) + "</span></div>" +
          (pp.notes ? '<div class="prose" style="margin-top:6px">' + md(pp.notes) + "</div>" : "") +
          '<div class="meta small muted">' + fmtDate(pp.preparedAt) + "</div>";
        sections += sec("준비" + atag, "preparation · " +
          (pp.pullRequestUrl ? "PR " + prShortLabel(pp.pullRequestUrl) : "PR 없음"), ppbody);
      }

      if (at.review) {
        var r = at.review;
        var rbody =
          '<div class="kv"><span>사람 승인</span><span>' + (r.manualApproval
            ? "<code>" + escapeHtml(r.manualApproval.context) + "</code> @ <code>" + escapeHtml(String(r.manualApproval.sha).slice(0, 7)) + "</code>"
            : '<span class="muted">불필요</span>') + "</span></div>" +
          '<div class="kv"><span>상태</span><span>' + escapeHtml(r.status || "—") + "</span></div>" +
          (r.reason ? '<div class="prose" style="margin-top:6px">' + md(r.reason) + "</div>" : "") +
          (r.comment ? '<div class="prose" style="margin-top:6px">' + md(r.comment) + "</div>" : "") +
          '<div class="meta small muted">' + fmtDate(r.reviewedAt) + "</div>";
        sections += sec("검토" + atag, "review · " + (r.status || ""), rbody);
      }

      if (at.execution) {
        var e = at.execution;
        var entries = (e.entries || []).map(function (en) {
          return "<li>step #" + en.stepSeq + " — <b>" + escapeHtml(en.status) + "</b>" +
            (en.log ? '<div class="muted small">' + escapeHtml(en.log) + "</div>" : "") + "</li>";
        }).join("");
        var ebody =
          '<div class="kv"><span>상태</span><span>' + escapeHtml(e.status || "—") + "</span></div>" +
          (entries ? '<ul class="entries">' + entries + "</ul>" : "") +
          '<div class="meta small muted">' + fmtDate(e.startedAt) + (e.finishedAt ? " → " + fmtDate(e.finishedAt) : "") + "</div>";
        sections += sec("실행" + atag, "execution · " + (e.status || ""), ebody);
      }

      if (at.verification) {
        var v = at.verification;
        var checks = (v.checks || []).map(function (c) {
          return "<li><b>" + escapeHtml(c.status) + "</b> — " + escapeHtml(c.name) +
            (c.detail ? '<div class="muted small">' + escapeHtml(c.detail) + "</div>" : "") + "</li>";
        }).join("");
        var vbody =
          '<div class="kv"><span>상태</span><span>' + escapeHtml(v.status || "—") + "</span></div>" +
          (v.asIsVersionAfter !== undefined ? '<div class="kv"><span>as-is 이후</span><span>' + fmtVersion(v.asIsVersionAfter) + "</span></div>" : "") +
          (checks ? '<ol class="checks">' + checks + "</ol>" : "") +
          '<div class="meta small muted">' + fmtDate(v.verifiedAt) + "</div>";
        sections += sec("검증" + atag, "verification · " + (v.status || ""), vbody);
      }
    });

    var prUrl = latestPrUrl(t);
    var prChip = prUrl
      ? ' <a class="chip prchip" href="' + escapeHtml(prUrl) + '" target="_blank" rel="noopener" title="' + escapeHtml(prUrl) + '">PR ' + escapeHtml(prShortLabel(prUrl)) + ' ↗</a>'
      : "";

    return '<div class="task">' +
      '<div class="task-head">' + statusBadge(t.status) + ' <code class="task-id">' + escapeHtml(taskDisplayId(t)) + "</code> " + actionPill + prChip +
        '<span class="spacer"></span><span class="muted small">detected ' + fmtDate(trig.detectedAt) + "</span></div>" +
      '<div class="task-trigger">' + triggerLabel + triggerReason + " " + fmtTriggerVersions(trig) + "</div>" +
      (sections ? '<div class="task-body">' + sections + "</div>" : "") +
      "</div>";
  }

  // checkPolicy.enabled === false 인 모델은 감지 sweep에서 제외된 모델이므로
  // 기본 목록에는 노출하지 않는다("숨김" 모드에서만 보인다).
  // 생략 시 기본값은 true(=노출).
  function isModelEnabled(m) {
    return !(m && m.checkPolicy && m.checkPolicy.enabled === false);
  }

  // ---------- view modes ----------
  function modeMeta(id) {
    for (var i = 0; i < MODES.length; i++) if (MODES[i].id === id) return MODES[i];
    return MODES[0];
  }

  function countTasks(modelId, pred) {
    return (state.tasksByModel[modelId] || []).filter(function (t) {
      return t && pred(t.status);
    }).length;
  }

  // 진행 중 = 완료(종료 상태)가 아닌 작업 수. 리뷰 대기 작업도 여기 함께 센다.
  function progressTaskCount(modelId) {
    return countTasks(modelId, function (s) { return DONE_STATUSES.indexOf(s) === -1; });
  }

  // 수동 승인 대기 = approved이면서 마지막 시도의 review에 manualApproval이 있는 작업.
  function awaitsManualApproval(t) {
    if (!t || t.status !== "approved") return false;
    var attempts = Array.isArray(t.attempts) ? t.attempts : [];
    var last = attempts.length ? attempts[attempts.length - 1] : null;
    return !!(last && last.review && last.review.manualApproval);
  }

  function manualApprovalTaskCount(modelId) {
    return (state.tasksByModel[modelId] || []).filter(awaitsManualApproval).length;
  }

  // 리뷰 대기 중 탭 = 수동 승인 대기 작업 수.
  function reviewTaskCount(modelId) {
    return manualApprovalTaskCount(modelId);
  }

  // ---------- 대상 레포 필터 ----------
  // 모델의 "대상 레포" = as-is/to-be 데이터 소스가 가리키는 github repository.
  // 두 소스가 서로 다른 레포를 볼 수 있으므로 집합으로 다룬다(둘 중 하나만 걸려도 그 레포의 모델).
  // github 이외의 소스(k8s·monitor·custom)만 쓰는 모델은 어떤 레포에도 속하지 않으므로
  // 레포를 고르면 목록에서 빠지고 "전체 레포"에서만 보인다.
  function modelRepos(m) {
    var out = [];
    ["toBe", "asIs"].forEach(function (side) {
      var ds = m && m[side] && m[side].dataSource;
      if (ds && ds.type === "github" && ds.repository && out.indexOf(ds.repository) === -1) {
        out.push(ds.repository);
      }
    });
    return out;
  }

  // 데이터에 실제로 등장하는 레포만 선택지로 만든다 — 별도 목록을 두면 그 자체가 drift 대상이 된다.
  function allRepos() {
    var seen = {}, out = [];
    state.models.forEach(function (m) {
      modelRepos(m).forEach(function (r) { if (!seen[r]) { seen[r] = true; out.push(r); } });
    });
    return out.sort();
  }

  // repo가 비어 있으면(= "전체 레포") 필터를 걸지 않는다.
  function matchesRepo(m, repo) {
    if (!repo) return true;
    return modelRepos(m).indexOf(repo) !== -1;
  }

  function modelsInRepo(repo) {
    return state.models.filter(function (m) { return matchesRepo(m, repo); });
  }

  // 모드별 개수도 레포 필터를 적용한 뒤에 센다 — 버튼의 숫자와 실제 목록이 어긋나지 않게.
  function modelsInMode(mode) {
    if (mode === "hidden") {
      return modelsInRepo(state.repo).filter(function (m) { return !isModelEnabled(m); });
    }
    var active = modelsInRepo(state.repo).filter(isModelEnabled);
    if (mode === "progress") {
      return active.filter(function (m) { return progressTaskCount(m.id) > 0; });
    }
    if (mode === "review") {
      return active.filter(function (m) { return reviewTaskCount(m.id) > 0; });
    }
    return active;
  }

  function matchesFilter(m, f) {
    if (!f) return true;
    var hay = [m.id, m.metadata && m.metadata.name, m.metadata && m.metadata.description]
      .concat((m.metadata && m.metadata.tags) || []).join(" ").toLowerCase();
    return hay.indexOf(f) !== -1;
  }

  // 목록 순서 = 마지막 조치가 최근인 모델부터. 파일 순서대로 두면 방금 움직인 모델이
  // 목록 아래에 묻혀 무엇이 살아 있는지 보이지 않는다. 조치 기록이 없는 모델(아직 task가
  // 없거나 전부 no-op)은 비교할 시각이 없으니 항상 뒤로 보내고, 시각이 같으면 원래
  // 파일 순서를 유지한다.
  // lastAction()은 그 모델의 모든 task를 훑으므로 비교 함수 안에서 부르면 O(n log n)번
  // 재계산된다 — 모델당 한 번만 계산해 두고 그 값으로 정렬한다.
  function byLastActionDesc(models) {
    return models.map(function (m, i) {
      var la = lastAction(m.id);
      return { model: m, time: la ? la.time : null, order: i };
    }).sort(function (a, b) {
      if (a.time === b.time) return a.order - b.order;
      if (a.time === null) return 1;
      if (b.time === null) return -1;
      return b.time - a.time;
    }).map(function (x) { return x.model; });
  }

  // 사이드바에 실제로 보이는 목록 = 모드 필터 + 검색 필터, 마지막 조치 최신순.
  function visibleModels() {
    var f = state.filter.trim().toLowerCase();
    return byLastActionDesc(
      modelsInMode(state.mode).filter(function (m) { return matchesFilter(m, f); })
    );
  }

  // 딥링크(#modelId)로 들어온 모델이 기본 모드에 없을 수 있으므로,
  // 그 모델을 담고 있는 첫 번째 모드를 찾아준다.
  function modeContaining(modelId) {
    for (var i = 0; i < MODES.length; i++) {
      var found = modelsInMode(MODES[i].id).some(function (m) { return m.id === modelId; });
      if (found) return MODES[i].id;
    }
    return DEFAULT_MODE;
  }

  // ---------- templates ----------
  // 정적 페이지는 디렉터리를 나열할 수 없으므로 템플릿 목록의 출처가 필요하다.
  // 별도 매니페스트(JSON)를 두면 templates/README.md의 "템플릿 목록" 표와 두 벌이
  // 되어 그 자체가 drift 대상이 되므로, 이미 유형의 SSOT인 그 표를 그대로 파싱한다.
  // → 템플릿을 추가할 때 README 표에만 한 줄 넣으면 이 페이지에도 자동으로 뜬다.
  var TEMPLATE_DIR = "templates/";
  var TEMPLATE_INDEX_FILE = "README.md";
  var TEMPLATE_HASH_PREFIX = "tpl:";
  var TEMPLATE_OVERVIEW = {
    file: TEMPLATE_INDEX_FILE,
    name: "템플릿 개요",
    type: "개요",
    target: "슬롯 규약 · 공통 기본값 · 인스턴스화 절차",
    overview: true
  };

  // README의 표에서 첫 칸이 `<name>.tbm.md` 인 행만 템플릿으로 본다.
  // (공통 규약 표 등 다른 표는 이 조건에 걸리지 않는다.)
  function parseTemplateIndex(src) {
    var out = [];
    var lines = String(src == null ? "" : src).replace(/\r\n?/g, "\n").split("\n");
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (line.charAt(0) !== "|") continue;
      var cells = line.replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (c) { return c.trim(); });
      var file = cells[0].replace(/^`+|`+$/g, "").trim();
      if (!/^[A-Za-z0-9._-]+\.tbm\.md$/.test(file)) continue;
      if (out.some(function (t) { return t.file === file; })) continue;
      out.push({
        file: file,
        name: cells[1] || file.replace(/\.tbm\.md$/, ""),
        type: cells[1] || "",
        target: cells[2] || ""
      });
    }
    return out;
  }

  // 사이드바에 나오는 항목 = 개요 + README 표의 템플릿들.
  function templateEntries() {
    return [TEMPLATE_OVERVIEW].concat(state.templates || []);
  }

  function templateByFile(file) {
    var found = templateEntries().filter(function (t) { return t.file === file; })[0];
    // 표에 없는 파일을 딥링크로 가리켜도 열어는 준다(없으면 상세에서 404로 드러난다).
    return found || { file: file, name: file, type: "", target: "" };
  }

  function matchesTemplateFilter(t, f) {
    if (!f) return true;
    return [t.file, t.name, t.type, t.target].join(" ").toLowerCase().indexOf(f) !== -1;
  }

  function visibleTemplates() {
    var f = state.filter.trim().toLowerCase();
    return templateEntries().filter(function (t) { return matchesTemplateFilter(t, f); });
  }

  function templateHash(file) { return TEMPLATE_HASH_PREFIX + file; }

  function templateFileFromHash(hash) {
    return hash.indexOf(TEMPLATE_HASH_PREFIX) === 0 ? hash.slice(TEMPLATE_HASH_PREFIX.length) : null;
  }

  // 이 모델에 마지막으로 무슨 조치가 언제 있었는지. task의 updatedAt만 보면 안 된다 —
  // 스키마상 선택 필드라 초기 기록엔 비어 있고, 그러면 실제로 방금 움직인 모델이 오래 묵은 것처럼 보인다.
  // 그래서 단계 기록에 남은 시각을 모두 훑어 가장 최근 것을 고르고, 동률이면 워크플로 뒤쪽 단계를 쓴다
  // (같은 시각에 여러 필드가 찍히면 그중 가장 진행된 단계가 그 시점의 조치다).
  // no_action_needed로 끝난 task는 "볼 게 없었다"는 결론이라 조치가 아니므로 통째로 뺀다
  // (사이드바 상태 점의 latestDisplayTask와 같은 기준).
  function lastAction(modelId) {
    var best = null;

    function take(at, label, taskId) {
      var t = Date.parse(at);
      if (isNaN(t)) return;
      if (!best || t >= best.time) best = { at: at, time: t, label: label, taskId: taskId };
    }

    (state.tasksByModel[modelId] || []).forEach(function (t) {
      if (t.status === "no_action_needed") return;
      take(t.updatedAt, "기록 갱신", t.id);
      take(t.createdAt, "작업 생성", t.id);
      take(t.trigger && t.trigger.detectedAt, "감지", t.id);
      take(t.stateSummary && t.stateSummary.summarizedAt, "상태 요약", t.id);
      take(t.assessment && t.assessment.assessedAt, "판단", t.id);
      (t.attempts || []).forEach(function (a) {
        take(a.plan && a.plan.plannedAt, "계획", t.id);
        take(a.preparation && a.preparation.preparedAt, "실행 준비", t.id);
        take(a.review && a.review.reviewedAt, "검토", t.id);
        if (a.execution) {
          take(a.execution.startedAt, "실행 시작", t.id);
          (a.execution.entries || []).forEach(function (en) {
            take(en.startedAt, "실행", t.id);
            take(en.finishedAt, "실행", t.id);
          });
          take(a.execution.finishedAt, "실행 완료", t.id);
        }
        take(a.verification && a.verification.verifiedAt, "검증", t.id);
      });
    });

    return best;
  }

  function latestDisplayTask(modelId) {
    // No-op detections should not mask the latest meaningful workflow status.
    var arr = (state.tasksByModel[modelId] || []).filter(function (t) {
      return t.status !== "no_action_needed";
    });
    if (!arr.length) return null;
    return arr.slice().sort(function (a, b) {
      return String(b.createdAt || "").localeCompare(String(a.createdAt || ""));
    })[0];
  }

  // ---------- rendering ----------
  function renderModes() {
    var box = $("#modes");
    box.innerHTML = MODES.map(function (mo) {
      return '<button type="button" data-mode="' + mo.id + '"' +
        ' aria-pressed="' + (state.mode === mo.id ? "true" : "false") + '"' +
        ' title="' + escapeHtml(mo.hint) + '">' + escapeHtml(mo.label) +
        '<span class="n">' + modelsInMode(mo.id).length + "</span></button>";
    }).join("");

    Array.prototype.forEach.call(box.querySelectorAll("button"), function (el) {
      el.addEventListener("click", function () { setMode(el.getAttribute("data-mode")); });
    });
  }

  function viewCount(id) {
    if (id === "models") return state.models.length;
    return state.templates ? state.templates.length : 0;
  }

  function renderViews() {
    var box = $("#views");
    box.innerHTML = VIEWS.map(function (v) {
      return '<button type="button" data-view="' + v.id + '"' +
        ' aria-pressed="' + (state.view === v.id ? "true" : "false") + '"' +
        ' title="' + escapeHtml(v.hint) + '">' + escapeHtml(v.label) +
        '<span class="n">' + viewCount(v.id) + "</span></button>";
    }).join("");

    Array.prototype.forEach.call(box.querySelectorAll("button"), function (el) {
      el.addEventListener("click", function () { setView(el.getAttribute("data-view")); });
    });
  }

  function renderRepoFilter() {
    var sel = $("#repo");
    var repos = allRepos();

    // 저장된 레포가 더 이상 데이터에 없으면(모델이 지워졌거나 레포가 바뀌었으면) 조용히 전체로 되돌린다.
    // 단 데이터가 아직 안 들어온 첫 렌더에서는 판단하지 않는다 — 그때는 레포 목록이 늘 비어 있어서
    // 복원해 둔 선택을 그대로 지워버리게 된다.
    if (state.repo && state.models.length && repos.indexOf(state.repo) === -1) {
      setStoredRepo((state.repo = ""));
    }

    sel.innerHTML = ['<option value="">전체 레포 (' + state.models.length + ")</option>"]
      .concat(repos.map(function (r) {
        return '<option value="' + escapeHtml(r) + '">' +
          escapeHtml(r) + " (" + modelsInRepo(r).length + ")</option>";
      })).join("");
    sel.value = state.repo;
    sel.title = state.repo ? "대상 레포: " + state.repo : "모든 레포의 모델을 봅니다";
    $("#repofilter").className = "repo-filter" + (state.repo ? " on" : "");
  }

  // 모드 전환·레포 필터·상태 범례는 모델 목록에만 해당하므로 템플릿 보기에선 감춘다.
  function applyViewChrome() {
    var tpl = state.view === "templates";
    $("#modes").style.display = tpl ? "none" : "";
    $("#repofilter").style.display = tpl ? "none" : "";
    $("#legend").style.display = tpl ? "none" : "";
    $("#search").placeholder = tpl ? "템플릿 검색…" : "이름·id·태그 검색…";
    $("#brandsub").innerHTML = tpl ? "모델 템플릿 · <code>templates/</code>" : "데이터 브라우저 · <code>data/</code>";
  }

  function renderSidebar() {
    var list = $("#modellist");
    var models = visibleModels();
    $("#listhead").textContent = modeMeta(state.mode).head;
    $("#modelcount").textContent = models.length;

    if (!models.length) {
      var msg = state.filter.trim() ? "일치하는 모델이 없습니다." : modeMeta(state.mode).empty;
      // 목록이 빈 이유가 레포 필터일 수 있으므로 어떤 레포로 좁혀져 있는지 함께 알려준다.
      if (state.repo) msg += " (레포: " + state.repo + ")";
      list.innerHTML = '<div class="empty small">' + escapeHtml(msg) + "</div>";
      return;
    }

    list.innerHTML = models.map(function (m) {
      var lt = latestDisplayTask(m.id);
      var meta = STATUS_META[lt && lt.status] || null;
      var dot = meta ? '<span class="dot" style="background:' + meta.color + '" title="' + escapeHtml(lt.status) + '"></span>' : '<span class="dot" style="background:var(--border-strong)" title="표시할 상태 없음"></span>';
      var count = (state.tasksByModel[m.id] || []).length;
      var progress = progressTaskCount(m.id);
      var progpill = progress ? '<span class="progpill" title="완료(' + DONE_STATUSES.join("/") + ')되지 않은 작업">진행 중 ' + progress + "</span>" : "";
      var manual = manualApprovalTaskCount(m.id);
      var manualpill = manual ? '<span class="manualpill" title="실행 대기(approved)지만 대상 레포의 사람 승인 status를 기다리는 작업(review.manualApproval)">수동 승인 대기 ' + manual + "</span>" : "";
      var hide = isModelEnabled(m) ? "" : '<span class="hidepill" title="감지 비활성">숨김</span>';
      var tags = ((m.metadata && m.metadata.tags) || []).slice(0, 3).map(function (t) { return '<span class="tag">' + escapeHtml(t) + "</span>"; }).join(" ");
      var la = lastAction(m.id);
      var acted = la
        ? '<div class="mi-acted" title="마지막 조치: ' + escapeHtml(la.label) + " · " + escapeHtml(la.at) +
            (la.taskId ? " · " + escapeHtml(la.taskId) : "") + '">마지막 조치 ' + escapeHtml(relTime(la.at)) +
            ' <span class="acted-what">' + escapeHtml(la.label) + "</span></div>"
        : '<div class="mi-acted" title="이 모델에 기록된 조치가 없습니다">마지막 조치 <span class="acted-what">기록 없음</span></div>';
      return '<button class="model-item' + (m.id === state.selected ? " active" : "") + '" data-id="' + escapeHtml(m.id) + '">' +
        '<div class="mi-name">' + dot + "<span>" + escapeHtml((m.metadata && m.metadata.name) || m.id) + "</span></div>" +
        '<div class="mi-id">' + escapeHtml(m.id) + "</div>" +
        '<div class="mi-meta">' + progpill + manualpill + hide + '<span class="taskcount">작업 ' + count + "</span> " + tags + "</div>" +
        acted +
        "</button>";
    }).join("");

    Array.prototype.forEach.call(list.querySelectorAll(".model-item"), function (el) {
      el.addEventListener("click", function () { select(el.getAttribute("data-id")); });
    });
  }

  function renderDetail() {
    var detail = $("#detail");
    var m = state.models.filter(function (x) { return x.id === state.selected; })[0];
    if (!m) {
      var nothingVisible = !visibleModels().length;
      detail.innerHTML = '<div class="empty">' +
        escapeHtml(nothingVisible ? modeMeta(state.mode).empty : "왼쪽에서 ToBeModel을 선택하세요.") +
        "</div>";
      return;
    }
    var md_ = m.metadata || {};
    var tags = (md_.tags || []).map(function (t) { return '<span class="tag">' + escapeHtml(t) + "</span>"; }).join(" ");
    var tasks = (state.tasksByModel[m.id] || []).slice().sort(function (a, b) {
      return String(b.createdAt || "").localeCompare(String(a.createdAt || ""));
    });
    var needAction = tasks.filter(taskNeedsAction);
    var lastAct = lastAction(m.id);

    var checkPolicy = "";
    if (m.checkPolicy) {
      checkPolicy = '<div class="checkpolicy">' +
        (m.checkPolicy.enabled === false ? "<span>감지: 비활성</span>" : "") +
        (m.checkPolicy.webhookEnabled != null ? "<span>webhook: " + (m.checkPolicy.webhookEnabled ? "on" : "off") + "</span>" : "") +
        "</div>";
    }

    var html =
      '<div class="m-header">' +
        "<h2>" + escapeHtml(md_.name || m.id) + "</h2>" +
        '<div class="m-id mono">' + escapeHtml(m.id) + "</div>" +
        (tags ? '<div class="tags">' + tags + "</div>" : "") +
        (md_.description ? '<p class="m-desc">' + escapeHtml(md_.description) + "</p>" : "") +
        '<div class="m-dates"><span>생성 ' + fmtDate(md_.createdAt) + "</span>" +
          (md_.updatedAt ? "<span>수정 " + fmtDate(md_.updatedAt) + "</span>" : "") +
          "<span>마지막 조치 " + (lastAct
            ? fmtDate(lastAct.at) + ' <span class="chip">' + escapeHtml(lastAct.label) + "</span>" +
              ' <span class="muted">' + escapeHtml(relTime(lastAct.at)) + "</span>"
            : '<span class="muted">—</span>') + "</span>" + "</div>" +
        (isModelEnabled(m) ? "" : '<p class="m-desc muted">이 모델은 감지가 비활성(<code>checkPolicy.enabled: false</code>)이라 기본 목록에서 숨겨집니다. 정의와 작업 이력은 그대로 보존됩니다.</p>') +
      "</div>" +

      '<div class="section-title">추적 상태 (tracked state)</div>' +
      '<div class="card"><div class="state-grid">' +
        fmtTracked("to-be", "tobe", m.toBe) +
        fmtTracked("as-is", "asis", m.asIs) +
      "</div>" + checkPolicy + "</div>" +

      '<details class="block"><summary>정의 <span class="muted small">definition (markdown)</span></summary>' +
        '<div class="block-body prose">' + md(m.definition) + "</div></details>" +

      taskSectionTitleHtml(tasks, needAction) +
      taskListHtml(tasks, needAction) +

      '<details class="raw"><summary>원본 JSON 보기 (raw)</summary>' +
        '<pre class="code"><code>' + escapeHtml(JSON.stringify(m, null, 2)) + "</code></pre>" +
        (tasks.length ? '<pre class="code"><code>' + escapeHtml(JSON.stringify(tasks, null, 2)) + "</code></pre>" : "") +
      "</details>";

    detail.innerHTML = html;
    var toggle = $("#taskfilter", detail);
    if (toggle) toggle.addEventListener("click", function () { setTasksActionOnly(!state.tasksActionOnly); });
    detail.scrollTop = 0;
  }

  // 토글은 작업이 하나라도 있을 때만 의미가 있다 — 작업이 없는 모델에선 그리지 않는다.
  function taskSectionTitleHtml(tasks, needAction) {
    var title = "정합성 작업 · " + tasks.length + "건 (reconciliation tasks)";
    if (!tasks.length) return '<div class="section-title">' + title + "</div>";
    return '<div class="section-title with-toggle"><span>' + title + "</span>" +
      '<button type="button" id="taskfilter" class="toggle" aria-pressed="' + (state.tasksActionOnly ? "true" : "false") +
      '" title="조치가 필요한 작업만 보기">조치 필요만 <span class="n">' + needAction.length + "</span></button></div>";
  }

  function taskListHtml(tasks, needAction) {
    if (!tasks.length) return '<div class="empty small">아직 생성된 작업이 없습니다.</div>';
    if (!state.tasksActionOnly) return tasks.map(fmtTask).join("");
    // 토글을 켠 채 조치 필요 건이 없으면 "작업이 없다"가 아니라 "걸러져 비었다"라고 적는다 —
    // 아래 N건이 필터 때문에 안 보이는 것임을 알려, 모델에 작업이 없다는 오해를 막는다.
    if (!needAction.length) {
      return '<div class="empty small">조치가 필요한 작업이 없습니다. ' +
        "전체 " + tasks.length + "건은 토글을 끄면 보입니다.</div>";
    }
    return needAction.map(fmtTask).join("");
  }

  function renderTemplateSidebar() {
    var list = $("#modellist");
    $("#listhead").textContent = "모델 템플릿";

    if (state.templatesError) {
      $("#modelcount").textContent = 0;
      list.innerHTML = '<div class="empty small">템플릿 목록을 불러오지 못했습니다.<br>' +
        "<code>" + escapeHtml(TEMPLATE_DIR + TEMPLATE_INDEX_FILE) + "</code> · " +
        escapeHtml(state.templatesError) + "</div>";
      return;
    }
    if (!state.templates) {
      $("#modelcount").textContent = 0;
      list.innerHTML = '<div class="empty small">불러오는 중…</div>';
      return;
    }

    var items = visibleTemplates();
    $("#modelcount").textContent = items.length;
    if (!items.length) {
      list.innerHTML = '<div class="empty small">일치하는 템플릿이 없습니다.</div>';
      return;
    }

    list.innerHTML = items.map(function (t) {
      return '<button class="model-item' + (t.file === state.selectedTemplate ? " active" : "") +
        '" data-file="' + escapeHtml(t.file) + '">' +
        '<div class="mi-name"><span class="dot" style="background:' +
          (t.overview ? "var(--border-strong)" : "var(--accent)") + '"></span><span>' +
          escapeHtml(t.name || t.file) + "</span></div>" +
        '<div class="mi-id">' + escapeHtml(t.file) + "</div>" +
        (t.target ? '<div class="mi-sub">' + escapeHtml(t.target) + "</div>" : "") +
        "</button>";
    }).join("");

    Array.prototype.forEach.call(list.querySelectorAll(".model-item"), function (el) {
      el.addEventListener("click", function () { selectTemplate(el.getAttribute("data-file")); });
    });
  }

  function renderTemplateDetail() {
    var detail = $("#detail");
    var file = state.selectedTemplate;
    if (!file) {
      detail.innerHTML = '<div class="empty">' +
        escapeHtml(state.templatesError ? "템플릿 목록을 불러올 수 없습니다." : "왼쪽에서 템플릿을 선택하세요.") + "</div>";
      return;
    }

    var t = templateByFile(file);
    var path = TEMPLATE_DIR + file;
    var gh = ghRepoUrl();
    var ghHref = gh ? gh + "/blob/main/" + path : null;
    var cached = state.templateBodies[file];

    var body;
    if (!cached) body = '<div class="doc-empty">불러오는 중…</div>';
    else if (cached.error) {
      body = '<div class="doc-empty">본문을 불러오지 못했습니다 (' + escapeHtml(cached.error) + ").<br>" +
        "<code>" + escapeHtml(path) + "</code>가 실제로 존재하는지 확인하세요 — " +
        "템플릿 목록은 <code>" + escapeHtml(TEMPLATE_DIR + TEMPLATE_INDEX_FILE) + "</code>의 표에서 읽습니다.</div>";
    } else body = '<div class="prose">' + md(cached.text) + "</div>";

    detail.innerHTML =
      '<div class="m-header">' +
        "<h2>" + escapeHtml(t.name || file) + "</h2>" +
        '<div class="m-id mono">' + escapeHtml(path) + "</div>" +
        '<div class="tags"><span class="tag">' + escapeHtml(t.overview ? "개요" : "템플릿") + "</span></div>" +
        (t.target ? '<p class="m-desc">' + escapeHtml(t.target) + "</p>" : "") +
        (ghHref ? '<div class="m-dates"><a href="' + escapeHtml(ghHref) +
          '" target="_blank" rel="noopener">GitHub에서 보기 ↗</a></div>' : "") +
      "</div>" +
      '<div class="section-title">' + escapeHtml(t.overview ? "템플릿 사용 규약" : "템플릿 본문") + "</div>" +
      '<div class="card doc-card">' + body + "</div>" +
      (cached && cached.text != null
        ? '<details class="raw"><summary>원본 마크다운 보기 (raw)</summary><pre class="code"><code>' +
            escapeHtml(cached.text) + "</code></pre></details>"
        : "");

    detail.scrollTop = 0;
    if (!cached) loadTemplateBody(file);
  }

  function renderLegend() {
    $("#legendbody").innerHTML = Object.keys(STATUS_META).map(function (k) {
      var m = STATUS_META[k];
      return '<div class="row"><span class="dot" style="background:' + m.color + '"></span>' +
        "<span>" + escapeHtml(m.label) + ' <span class="muted small">' + k + "</span></span></div>";
    }).join("");
  }

  function renderAll() {
    renderViews();
    renderRepoFilter();
    applyViewChrome();
    if (state.view === "templates") { renderTemplateSidebar(); renderTemplateDetail(); return; }
    renderModes(); renderSidebar(); renderDetail();
  }

  function writeHash(id) {
    if (history.replaceState) {
      history.replaceState(null, "", id ? "#" + encodeURIComponent(id) : location.pathname + location.search);
    } else location.hash = id ? encodeURIComponent(id) : "";
  }

  // 모델 선택은 주소에 남기지 않는다 — 새로고침하면 보던 모델이 아니라 기본 선택(목록의 첫 모델,
  // 즉 가장 최근에 움직인 모델)으로 연다. 딥링크(#<toBeModelId>)로 들어온 뒤 다른 모델을 고르면
  // 그 딥링크도 지워, 새로고침이 예전 딥링크 모델로 되돌아가지 않게 한다.
  function clearModelHash() {
    if (state.view !== "templates") writeHash(null);
  }

  function select(id) {
    state.selected = id;
    clearModelHash();
    renderSidebar();
    renderDetail();
  }

  function selectTemplate(file) {
    state.selectedTemplate = file;
    writeHash(file ? templateHash(file) : null);
    renderTemplateSidebar();
    renderTemplateDetail();
  }

  // 보기를 바꾸면 주소도 그 보기의 선택 대상을 가리키게 맞춘다.
  function setView(view) {
    if (state.view === view) return;
    state.view = view;
    // 검색어는 보기마다 대상이 다르므로 넘어갈 때 비운다
    // (모델 이름으로 걸린 필터가 템플릿 목록을 통째로 비우는 일을 막는다).
    state.filter = "";
    $("#search").value = "";
    if (view === "templates") {
      if (state.templates == null && !state.templatesError) loadTemplates();
      if (!state.selectedTemplate) state.selectedTemplate = TEMPLATE_OVERVIEW.file;
      writeHash(templateHash(state.selectedTemplate));
    } else {
      clearModelHash();
    }
    renderAll();
  }

  // 모드·레포를 바꾸면 선택된 모델이 목록에서 사라질 수 있다.
  // 그럴 땐 새 목록의 첫 모델로 옮기고, 비어 있으면 선택을 해제한다.
  function reselectVisible() {
    var models = visibleModels();
    if (models.some(function (m) { return m.id === state.selected; })) return;
    state.selected = models.length ? models[0].id : null;
    clearModelHash();
  }

  function setMode(mode) {
    if (state.mode === mode) return;
    state.mode = mode;
    state.modePinned = true;
    setStoredMode(mode);
    reselectVisible();
    renderAll();
  }

  function setRepo(repo) {
    if (state.repo === repo) return;
    state.repo = repo;
    setStoredRepo(repo);
    reselectVisible();
    renderAll();
  }

  // 토글은 상세의 작업 목록만 바꾼다 — 사이드바·모드·선택은 그대로이므로 상세만 다시 그린다.
  function setTasksActionOnly(on) {
    on = !!on;
    if (state.tasksActionOnly === on) return;
    state.tasksActionOnly = on;
    setStoredTasksActionOnly(on);
    renderDetail();
  }

  // ---------- 사용자 선택 저장 (새로고침해도 유지) ----------
  // 테마와 같은 자리(localStorage)에 모드와 레포도 남긴다. 저장이 막힌 환경(사파리 프라이빗 등)에서는
  // 조용히 무시하고 기본값으로 동작한다 — 페이지가 저장 실패로 깨지지 않게.
  var STORE_MODE = "reconciler-mode";
  var STORE_REPO = "reconciler-repo";
  var STORE_TASKS_ACTION_ONLY = "reconciler-tasks-action-only";

  function storeGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function storeSet(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }

  // 저장값은 신뢰하지 않는다 — 모드 목록에 없는 값이면 버리고 기본값을 쓴다.
  function storedMode() {
    var v = storeGet(STORE_MODE);
    return MODES.some(function (mo) { return mo.id === v; }) ? v : null;
  }
  function setStoredMode(mode) { storeSet(STORE_MODE, mode); }

  // 레포는 값 목록을 미리 알 수 없으므로 그대로 읽고, 데이터에 없으면 renderRepoFilter가 되돌린다.
  function storedRepo() { return storeGet(STORE_REPO) || ""; }
  function setStoredRepo(repo) { storeSet(STORE_REPO, repo); }

  // 저장값이 "1"일 때만 켠다 — 알 수 없는 값은 꺼짐(전체 보기)으로 떨어뜨려, 저장소가 오염돼도
  // 작업이 숨겨진 채로 열리지 않게 한다.
  function storedTasksActionOnly() { return storeGet(STORE_TASKS_ACTION_ONLY) === "1"; }
  function setStoredTasksActionOnly(on) { storeSet(STORE_TASKS_ACTION_ONLY, on ? "1" : "0"); }

  // 딥링크(#modelId)로 들어온 모델이 저장된 레포 필터 밖이면 링크가 이긴다 — 필터를 푼다.
  // (아니면 공유받은 링크가 "빈 목록"으로 열려 원인을 알 수 없다.)
  function releaseRepoFilterFor(modelId) {
    if (!state.repo) return;
    var m = state.models.filter(function (x) { return x.id === modelId; })[0];
    if (m && matchesRepo(m, state.repo)) return;
    state.repo = "";
    setStoredRepo("");
  }

  // ---------- data loading ----------
  function setStatus(msg, isErr) {
    var bar = $("#statusbar");
    if (!msg) { bar.className = ""; bar.textContent = ""; return; }
    bar.className = "show" + (isErr ? " err" : "");
    bar.innerHTML = msg;
  }

  function fetchJSON(url) {
    return fetch(url, { cache: "no-cache" }).then(function (r) {
      if (!r.ok) { var e = new Error("HTTP " + r.status); e.status = r.status; throw e; }
      return r.json();
    });
  }

  function fetchText(url) {
    return fetch(url, { cache: "no-cache" }).then(function (r) {
      if (!r.ok) { var e = new Error("HTTP " + r.status); e.status = r.status; throw e; }
      return r.text();
    });
  }

  // 템플릿 목록은 모델 데이터와 독립적으로 불러온다 — 한쪽이 실패해도 다른 쪽은 계속 보인다.
  function loadTemplates() {
    return fetchText(TEMPLATE_DIR + TEMPLATE_INDEX_FILE).then(function (text) {
      state.templateBodies[TEMPLATE_INDEX_FILE] = { text: text };
      state.templates = parseTemplateIndex(text);
      state.templatesError = null;
    }).catch(function (err) {
      state.templates = null;
      state.templatesError = err.message;
    }).then(function () {
      renderViews();
      if (state.view === "templates") { renderTemplateSidebar(); renderTemplateDetail(); }
    });
  }

  function loadTemplateBody(file) {
    return fetchText(TEMPLATE_DIR + file).then(function (text) {
      state.templateBodies[file] = { text: text };
    }).catch(function (err) {
      state.templateBodies[file] = { error: err.message };
    }).then(function () {
      // 그 사이 다른 항목으로 옮겼으면 다시 그리지 않는다.
      if (state.view === "templates" && state.selectedTemplate === file) renderTemplateDetail();
    });
  }

  function loadData() {
    setStatus("불러오는 중…");
    return fetchJSON("data/to-be-models.json").then(function (models) {
      // 숨김(감지 비활성) 모델도 함께 담아둔다 — "숨김" 모드에서 그대로 보여주기 위해서다.
      // 어떤 모델이 실제로 목록에 나올지는 modelsInMode()가 정한다.
      state.models = Array.isArray(models) ? models : [];
      // Task files are named <toBeModelId>.json. A model may have no tasks yet,
      // in which case the fetch 404s — that is expected and handled as "no tasks".
      // (The browser still logs the 404 to the console; it is harmless.)
      return Promise.all(state.models.map(function (m) {
        return fetchJSON("data/reconciliation-tasks/" + encodeURIComponent(m.id) + ".json")
          .then(function (arr) { return Array.isArray(arr) ? arr : []; })
          .catch(function () { return []; });
      }));
    }).then(function (taskArrays) {
      state.tasksByModel = {};
      state.models.forEach(function (m, idx) { state.tasksByModel[m.id] = taskArrays[idx]; });
      state.models.sort(function (a, b) {
        return String((a.metadata && a.metadata.name) || a.id).localeCompare(String((b.metadata && b.metadata.name) || b.id));
      });

      var hash = decodeURIComponent((location.hash || "").replace(/^#/, ""));
      var target = hash && state.models.some(function (m) { return m.id === hash; }) ? hash : null;

      // 딥링크가 있으면 그 모델이 보이는 것이 우선이다 — 필요하면 저장된 레포 필터를 풀고
      // 모드도 그 모델을 담은 모드로 옮긴다. 저장된 모드가 이미 그 모델을 보여주면 그대로 둔다.
      // 딥링크가 없으면 사용자가 고른 모드(저장값)를 존중하고, 그것도 없으면 기본 모드로 연다.
      if (target) {
        releaseRepoFilterFor(target);
        if (!modelsInMode(state.mode).some(function (m) { return m.id === target; })) {
          state.mode = modeContaining(target);
        }
      } else if (!state.modePinned) {
        state.mode = DEFAULT_MODE;
      }

      var models = visibleModels();
      if (target && models.some(function (m) { return m.id === target; })) state.selected = target;
      else if (!models.some(function (m) { return m.id === state.selected; })) {
        state.selected = models.length ? models[0].id : null;
      }

      var totalTasks = Object.keys(state.tasksByModel).reduce(function (n, k) { return n + state.tasksByModel[k].length; }, 0);
      setStatus("진행 중 " + modelsInMode("progress").length +
        "개 · 리뷰 대기 " + modelsInMode("review").length +
        "개 · 활성 " + modelsInMode("active").length +
        "개 · 숨김 " + modelsInMode("hidden").length + "개 · 작업 " + totalTasks + "건 · " +
        (state.repo ? "레포 " + escapeHtml(state.repo) + " · " : "") +
        new Date().toLocaleTimeString() + " 로드됨");
      setTimeout(function () { setStatus(""); }, 4000);

      renderAll();
    }).catch(function (err) {
      var hint = (location.protocol === "file:")
        ? "이 페이지는 <b>file://</b>로는 데이터를 불러올 수 없습니다. GitHub Pages 또는 로컬 서버(<code>python3 -m http.server</code>)로 열어주세요."
        : "<code>data/to-be-models.json</code>을 불러오지 못했습니다 (" + escapeHtml(err.message) + "). 이 파일이 페이지와 같은 경로에 서빙되는지 확인하세요.";
      setStatus(hint, true);
      $("#detail").innerHTML = '<div class="empty">데이터를 불러올 수 없습니다.<br><br>' + hint + "</div>";
    });
  }

  // ---------- theme ----------
  function applyTheme(t) {
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    try { localStorage.setItem("reconciler-theme", t); } catch (e) {}
  }
  function currentTheme() {
    try { return localStorage.getItem("reconciler-theme") || "auto"; } catch (e) { return "auto"; }
  }
  function cycleTheme() {
    var order = ["auto", "light", "dark"];
    var next = order[(order.indexOf(currentTheme()) + 1) % order.length];
    applyTheme(next);
  }

  // ---------- GitHub link ----------
  function ghRepoUrl() {
    var h = location.hostname;
    if (/\.github\.io$/.test(h)) {
      var owner = h.split(".")[0];
      var seg = location.pathname.split("/").filter(Boolean);
      if (seg[0]) return "https://github.com/" + owner + "/" + seg[0];
    }
    return null;
  }

  // ---------- init ----------
  function init() {
    applyTheme(currentTheme());

    // 저장된 선택을 먼저 복원한 뒤에 그린다 — 기본값으로 한 번 그렸다가 바뀌는 깜빡임을 피한다.
    var savedMode = storedMode();
    if (savedMode) { state.mode = savedMode; state.modePinned = true; }
    state.repo = storedRepo();
    state.tasksActionOnly = storedTasksActionOnly();

    renderLegend();
    renderModes();
    renderRepoFilter();

    // #tpl:<파일>로 들어오면 템플릿 보기로 연다.
    var initialTpl = templateFileFromHash(decodeURIComponent((location.hash || "").replace(/^#/, "")));
    if (initialTpl) { state.view = "templates"; state.selectedTemplate = initialTpl; }
    renderViews();
    applyViewChrome();

    var gh = ghRepoUrl();
    if (gh) { var a = $("#ghlink"); a.href = gh; a.style.display = ""; }

    $("#search").addEventListener("input", function (e) {
      state.filter = e.target.value;
      if (state.view === "templates") renderTemplateSidebar(); else renderSidebar();
    });
    $("#repo").addEventListener("change", function (e) { setRepo(e.target.value); });
    $("#reload").addEventListener("click", function () { loadTemplates(); loadData(); });
    $("#theme").addEventListener("click", cycleTheme);
    window.addEventListener("hashchange", function () {
      var hash = decodeURIComponent((location.hash || "").replace(/^#/, ""));
      var tplFile = templateFileFromHash(hash);
      if (tplFile) {
        if (state.view !== "templates" || tplFile !== state.selectedTemplate) {
          state.view = "templates";
          state.selectedTemplate = tplFile;
          if (state.templates == null && !state.templatesError) loadTemplates();
          renderAll();
        }
        return;
      }
      if (hash && state.models.some(function (m) { return m.id === hash; })) {
        if (state.view === "templates" || hash !== state.selected) {
          state.view = "models";
          // 레포 필터에 걸려 안 보이는 모델을 가리키면 필터를 풀고,
          // 현재 모드에 없는 모델을 가리키면 그 모델이 보이는 모드로 옮겨준다.
          releaseRepoFilterFor(hash);
          if (!modelsInMode(state.mode).some(function (m) { return m.id === hash; })) {
            state.mode = modeContaining(hash);
          }
          state.selected = hash; renderAll();
        }
      }
    });

    loadTemplates();
    loadData();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
