# Claude Code로 reconciler-data-plane 스킬 한 단계를 실행한다(reconciler-local 러너의 CI판).
#
#   1. Claude Code CLI 설치(버전 고정 가능) — 인증은 OAuth 토큰(CLAUDE_CODE_OAUTH_TOKEN, `claude setup-token`).
#   2. 플러그인 마켓플레이스(dlddu/plugin-marketplace, private) 등록 + reconciler-data-plane 설치.
#      마켓플레이스 클론용 읽기 토큰은 homelab-k3s-mcp의 github_app_installation_token으로 받고,
#      그 토큰은 설치 명령의 git 환경에만 준다(전역 git 설정·에이전트 환경에 남기지 않는다).
#   3. MCP 설정 — 서버 이름은 스킬이 부르는 `k3s`(k3s:github_app_installation_token 등).
#      주소는 homelab-mcp 액션이 띄운 로컬 OIDC 프록시라 설정 파일에 토큰이 없다.
#   4. `claude -p "/reconciler-data-plane:<skill> <checkout-dir>"` — reconciler-local의
#      `claude --bg ... "/reconciler-data-plane:<skill> $DIR"`와 같은 호출. checkout은 이 실행 전용이다.
#   5. 사용 한도 초과로 중단됐으면 PocketAide 푸시(homelab-k3s-mcp pocket_aide_notification_send).
#   6. 대화 기록 요약 → step summary, 비밀값 가림 → 아티팩트 업로드, 마지막에 성패 판정.
#
# GitHub 토큰 경계(README 「모델 키 격리」와 같은 원칙):
#   - reconciler 쓰기: 호출 job이 checkout-dir에 미리 체크아웃해 둔 워크플로 GITHUB_TOKEN(contents: write)
#     자격 증명으로 한다. 이 토큰은 .github/workflows를 바꿀 수 없다. homelab-k3s-mcp의 githubToken 상한은
#     reconciler를 빼 두므로, 스킬(reconciler-repo-access)이 reconciler용 App 토큰을 받는 단계는 건너뛰게 지시한다.
#   - 대상 레포·plugin-marketplace: MCP github_app_installation_token(규칙별 상한 안)으로 받는다.
#   - claude 환경에서는 OIDC 요청 변수·러너의 SOURCE_GITHUB_TOKEN·GITHUB_TOKEN 환경 변수를 뺀다.
name: Run reconciler skill (Claude Code)
description: Claude Code CLI + reconciler-data-plane 플러그인으로 스킬 한 단계를 헤드리스 실행

inputs:
  skill:
    description: 스킬 이름(예 reconciler-drift-detector)
    required: true
  harness-dir:
    description: 이 레포 체크아웃 경로(스크립트 위치)
    required: true
  oauth-token:
    description: Claude Code OAuth 토큰(`claude setup-token`). environment llm-claude의 secret
    required: true
  checkout-dir:
    description: 이 실행 전용 reconciler checkout(기본 브랜치, push 자격 증명 포함). 스킬 인자로 넘긴다
    required: true
  default-branch:
    description: reconciler 기본 브랜치(push 안 된 커밋 점검용)
    required: false
    default: main
  mcp-local-url:
    description: homelab-mcp 액션이 띄운 로컬 MCP 주소
    required: true
  out-dir:
    description: 로그·대화 기록을 둘 디렉터리(아티팩트로 올라간다)
    required: true
  target-id:
    description: 이번 실행의 대상(러너의 Select target이 고른 것, <tbm>/<rct> 또는 tbm_). 스킬은 이 대상만 본다. 비우면 스킬이 Step 0으로 고른다
    required: false
    default: ""
  model:
    description: 모델 override(예 claude-opus-5-5, opus). 비우면 계정 기본값
    required: false
    default: ""
  claude-version:
    description: Claude Code 버전(stable | latest | 1.2.3)
    required: false
    default: stable
  marketplace-url:
    description: 플러그인 마켓플레이스 git URL
    required: false
    default: https://github.com/dlddu/plugin-marketplace.git
  marketplace-repo:
    description: 마켓플레이스 읽기 토큰을 받을 레포 이름(owner 없이)
    required: false
    default: plugin-marketplace
  plugin:
    description: 설치할 플러그인(<name>@<marketplace>)
    required: false
    default: reconciler-data-plane@dlddu-plugins
  timeout:
    description: claude 실행 제한 시간(coreutils timeout 형식)
    required: false
    default: 50m
  artifact-name:
    description: 업로드할 아티팩트 이름
    required: true
  target-label:
    description: 알림·요약에 적을 대상(선정 결과). 비우면 생략
    required: false
    default: ""
  notify-on-limit:
    description: 사용 한도 초과로 중단되면 PocketAide 푸시를 보낼지(true|false)
    required: false
    default: "true"
  notify-tz:
    description: 알림의 재설정 시각 표기 시간대
    required: false
    default: Asia/Seoul

outputs:
  exit-code:
    description: claude 종료 코드(124면 시간 초과)
    value: ${{ steps.run.outputs.exit_code }}
  usage-limited:
    description: 사용 한도 초과로 중단됐는지(true|false)
    value: ${{ steps.limit.outputs.limited }}

runs:
  using: composite
  steps:
    - name: Prepare run directories
      id: prep
      shell: bash
      env:
        OUT: ${{ inputs.out-dir }}
        CHECKOUT_DIR: ${{ inputs.checkout-dir }}
      run: |
        mkdir -p "$OUT/logs"
        # 스킬은 checkout이 이미 있으면 클론하지 않고 pull --rebase만 한다(reconciler-repo-access Step 1).
        test -d "$CHECKOUT_DIR/.git" || { echo "::error::checkout-dir에 reconciler checkout이 없음: $CHECKOUT_DIR"; exit 1; }
        # 에이전트 작업 디렉터리는 하네스 체크아웃과 분리한다.
        ws="$RUNNER_TEMP/claude-ws"; mkdir -p "$ws"
        echo "workspace=$ws" >> "$GITHUB_OUTPUT"
        # 스킬이 만드는 커밋의 작성자는 로컬 러너와 같은 봇 신원. committer 이름만 Actions 실행으로
        # 구분해(Run skill의 GIT_COMMITTER_NAME) 이번 실행이 push한 커밋을 골라 볼 수 있게 한다.
        git config --global user.name "reconciler-bot"
        git config --global user.email "reconciler@dlddu.dev"

    - name: Install Claude Code
      shell: bash
      env:
        VERSION: ${{ inputs.claude-version }}
      run: |
        curl -fsSL https://claude.ai/install.sh | bash -s -- "$VERSION"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/claude" --version

    # 마켓플레이스가 private라 클론에 토큰이 필요하다. 토큰은 이 스텝의 git 환경 변수
    # (GIT_CONFIG_*: http.extraheader)로만 주고 ~/.gitconfig·에이전트 환경에는 남기지 않는다.
    - name: Install reconciler-data-plane plugin
      shell: bash
      env:
        HARNESS: ${{ inputs.harness-dir }}
        MCP_URL: ${{ inputs.mcp-local-url }}
        MARKETPLACE_URL: ${{ inputs.marketplace-url }}
        MARKETPLACE_REPO: ${{ inputs.marketplace-repo }}
        PLUGIN: ${{ inputs.plugin }}
        OUT: ${{ inputs.out-dir }}
      run: |
        # 토큰은 셸 변수로만 받는다($GITHUB_ENV·파일에 쓰지 않는다 — 이 스텝 밖으로 나가지 않게).
        args="{\"repositories\":[\"$MARKETPLACE_REPO\"],\"permissions\":{\"contents\":\"read\",\"metadata\":\"read\"}}"
        resp="$(python3 "$HARNESS/.github/scripts/mcp_call.py" --url "$MCP_URL" call github_app_installation_token --args "$args")" \
          || { echo "::error::plugin-marketplace 읽기 토큰 발급 실패 — GitHub App 설치 범위에 $MARKETPLACE_REPO가 있는지 확인"; exit 1; }
        token="$(printf '%s\n' "$resp" | sed -n 's/^[[:space:]]*GITHUB_TOKEN=//p' | tail -n 1 | tr -d "\"'")"
        unset resp
        [ -n "$token" ] || { echo "::error::github_app_installation_token 응답에 GITHUB_TOKEN= 줄이 없음"; exit 1; }
        echo "::add-mask::$token"
        basic="$(printf 'x-access-token:%s' "$token" | base64 -w0)"
        echo "::add-mask::$basic"
        export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
        export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic" GIT_TERMINAL_PROMPT=0
        export CLAUDE_CODE_PLUGIN_PREFER_HTTPS=1  # SSH 탐색을 건너뛰고 위 헤더가 붙는 HTTPS로 클론
        claude plugin marketplace add "$MARKETPLACE_URL" --scope user 2>&1 | tee "$OUT/logs/plugin-install.log"
        claude plugin install "$PLUGIN" --scope user 2>&1 | tee -a "$OUT/logs/plugin-install.log"
        unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
        claude plugin list 2>&1 | tee -a "$OUT/logs/plugin-install.log"
        grep -q "${PLUGIN%@*}" "$OUT/logs/plugin-install.log" \
          || { echo "::error::플러그인 $PLUGIN 설치를 확인하지 못함 — logs/plugin-install.log 참고"; exit 1; }

    - name: Write MCP config
      id: mcp
      shell: bash
      env:
        MCP_URL: ${{ inputs.mcp-local-url }}
        OUT: ${{ inputs.out-dir }}
      run: |
        cfg="$RUNNER_TEMP/claude-mcp.json"
        printf '{"mcpServers":{"k3s":{"type":"http","url":"%s"}}}\n' "$MCP_URL" > "$cfg"
        cp "$cfg" "$OUT/logs/mcp-config.json"
        echo "config=$cfg" >> "$GITHUB_OUTPUT"

    - name: Run skill
      id: run
      shell: bash
      env:
        SKILL: ${{ inputs.skill }}
        CHECKOUT_DIR: ${{ inputs.checkout-dir }}
        WS: ${{ steps.prep.outputs.workspace }}
        MCP_CONFIG: ${{ steps.mcp.outputs.config }}
        TARGET_ID: ${{ inputs.target-id }}
        MODEL: ${{ inputs.model }}
        TIMEOUT: ${{ inputs.timeout }}
        OUT: ${{ inputs.out-dir }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.oauth-token }}
        GIT_COMMITTER_NAME: reconciler-bot-actions
        DISABLE_UPDATES: "1"
        DISABLE_AUTOUPDATER: "1"
        CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      run: |
        test -n "$CLAUDE_CODE_OAUTH_TOKEN" || { echo "::error::secrets.CLAUDE_CODE_OAUTH_TOKEN이 비어 있음"; echo "exit_code=2" >> "$GITHUB_OUTPUT"; exit 0; }
        prompt="/reconciler-data-plane:$SKILL $CHECKOUT_DIR"
        printf '%s\n' "$prompt" > "$OUT/logs/prompt.txt"
        # 무인 실행: 권한 프롬프트에 답할 사람이 없으므로 bypassPermissions(로컬 러너와 같다).
        # 모드를 지정하지 않으면 -p는 Manual로 시작해 승인 안 된 도구 호출을 거부한다.
        # MCP는 이 설정 파일만 쓴다(--strict-mcp-config) — 플러그인·사용자 설정의 다른 서버를 섞지 않는다.
        args=(-p "$prompt" --permission-mode bypassPermissions
              --mcp-config "$MCP_CONFIG" --strict-mcp-config
              --output-format stream-json --verbose)
        [ -n "$MODEL" ] && args+=(--model "$MODEL")
        # 실행 환경 규칙과 대상은 시스템 프롬프트로 덧붙인다(슬래시 명령 뒤 문자열은 통째로 $ARGUMENTS=checkout 경로).
        # 대상을 넘기지 않으면 스킬이 Step 0을 다시 돌려 러너와 다른 후보(예: 감지 비활성 모델의 task)를 고를 수 있다.
        sys="이 실행은 GitHub Actions 러너다. reconciler 레포는 러너가 $CHECKOUT_DIR 에 기본 브랜치로 미리 체크아웃해 두었고, push 자격 증명이 그 checkout의 git 설정에 들어 있다. reconciler-repo-access를 따르되 reconciler 레포에 대해서는 k3s:github_app_installation_token 발급과 ~/.git-credentials 설정(Step 1 읽기 토큰 · Step 3 쓰기 토큰)을 건너뛰고, 그 checkout에서 git pull --rebase · commit · push만 한다 — 서버가 reconciler 토큰 발급을 거부하도록 설정돼 있다. 그 checkout의 git 원격·자격 증명 설정을 바꾸지 말고 .github/ 아래 파일은 수정하지 않는다. 대상 레포·plugin-marketplace 토큰은 스킬 지침대로 MCP로 받는다."
        if [ -n "$TARGET_ID" ]; then
          sys="$sys"$'\n'"이번 실행의 대상은 정해져 있다: $TARGET_ID (러너가 스킬 Step 0과 같은 규칙으로 고른 대상 — 워크플로 입력으로 지목된 경우 그 지목을 반영했다). 스킬 Step 0의 '사용자가 특정 모델/task를 지목했으면 그 대상으로 한정한다'를 따라 이 대상만 본다. 다른 후보를 스스로 다시 고르지 않는다. 이 대상이 진입 게이트(점유 전제)를 통과하지 못하면 다른 대상으로 넘어가지 말고 이유를 보고하고 종료한다."
        fi
        args+=(--append-system-prompt "$sys")
        echo "prompt: $prompt${TARGET_ID:+ (지목 $TARGET_ID)}"
        set +e
        cd "$WS"
        # ANTHROPIC_API_KEY/AUTH_TOKEN이 있으면 OAuth 토큰보다 우선하므로 뺀다.
        env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
            -u SOURCE_GITHUB_TOKEN -u GITHUB_TOKEN -u GH_TOKEN \
            -u ANTHROPIC_API_KEY -u ANTHROPIC_AUTH_TOKEN \
          timeout --kill-after=60s "$TIMEOUT" claude "${args[@]}" \
          > "$OUT/logs/transcript.jsonl" 2> "$OUT/logs/stderr.log"
        code=$?
        set -e
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"
        tail -n 20 "$OUT/logs/stderr.log" || true
        [ "$code" -eq 124 ] && echo "::error::claude 실행이 $TIMEOUT 안에 끝나지 않음 — 점유가 남았을 수 있다(다음 실행의 resume/재확인 규칙이 이어받는다)"
        exit 0

    # claude -p는 한도에 걸려도 exit 0 · subtype success로 끝난다 — 대화 기록(rate_limit_event · result 본문)으로 판정한다.
    - name: Detect usage limit
      id: limit
      if: always() && steps.run.outcome == 'success'
      shell: bash
      env:
        HARNESS: ${{ inputs.harness-dir }}
        OUT: ${{ inputs.out-dir }}
        TZ_NAME: ${{ inputs.notify-tz }}
      run: python3 "$HARNESS/.github/scripts/claude_transcript.py" limit "$OUT/logs/transcript.jsonl" --tz "$TZ_NAME"

    # 알림이 실패해도 실행 판정은 바꾸지 않는다(경고만). devices=0이면 등록된 기기가 없다는 뜻이다.
    - name: Notify PocketAide (usage limit)
      if: always() && steps.limit.outputs.limited == 'true' && inputs.notify-on-limit == 'true'
      shell: bash
      env:
        HARNESS: ${{ inputs.harness-dir }}
        MCP_URL: ${{ inputs.mcp-local-url }}
        OUT: ${{ inputs.out-dir }}
        SKILL: ${{ inputs.skill }}
        TARGET: ${{ inputs.target-label }}
        TZ_NAME: ${{ inputs.notify-tz }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        t="$HARNESS/.github/scripts/claude_transcript.py"
        args="$(python3 "$t" notify-args "$OUT/logs/transcript.jsonl" --skill "$SKILL" --target "$TARGET" \
                  --run-url "$RUN_URL" --tz "$TZ_NAME")"
        printf '%s\n' "$args" > "$OUT/logs/notify-args.json"
        if python3 "$HARNESS/.github/scripts/mcp_call.py" --url "$MCP_URL" \
             call pocket_aide_notification_send --args "$args" > "$OUT/logs/notify-result.txt" 2>&1; then
          echo "PocketAide 알림 보냄: $(tr '\n' ' ' < "$OUT/logs/notify-result.txt")"
          echo "- 📣 PocketAide 알림 보냄: $(tr '\n' ' ' < "$OUT/logs/notify-result.txt" | cut -c1-200)" >> "$GITHUB_STEP_SUMMARY"
        else
          cat "$OUT/logs/notify-result.txt"
          echo "::warning::PocketAide 알림 실패 — 이 워크플로 OIDC 규칙에 pocket_aide_notification_send가 있는지 확인"
          echo "- ⚠️ PocketAide 알림 실패" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Summarize
      if: always()
      shell: bash
      env:
        HARNESS: ${{ inputs.harness-dir }}
        SKILL: ${{ inputs.skill }}
        OUT: ${{ inputs.out-dir }}
        CHECKOUT_DIR: ${{ inputs.checkout-dir }}
        DEFAULT_BRANCH: ${{ inputs.default-branch }}
        TARGET: ${{ inputs.target-label }}
        EXIT_CODE: ${{ steps.run.outputs.exit_code }}
      run: |
        t="$HARNESS/.github/scripts/claude_transcript.py"
        python3 "$t" final "$OUT/logs/transcript.jsonl" --out "$OUT/logs/final-message.md" || true
        # 스킬이 이번 실행에서 만든 reconciler 커밋(committer = reconciler-bot-actions). 점유·판정 기록의 증거다.
        # 같은 브랜치에 들어온 로컬 러너 커밋(committer reconciler-bot)과 섞이지 않는다.
        if [ -d "$CHECKOUT_DIR/.git" ]; then
          git -C "$CHECKOUT_DIR" log --format='%h %s' --committer=reconciler-bot-actions --since="6 hours ago" -n 20 \
            > "$OUT/logs/commits.txt" 2>/dev/null || true
          git -C "$CHECKOUT_DIR" status --short > "$OUT/logs/checkout-status.txt" 2>/dev/null || true
          git -C "$CHECKOUT_DIR" fetch --quiet origin "$DEFAULT_BRANCH" 2>/dev/null || true
          git -C "$CHECKOUT_DIR" log --format='%h' "origin/$DEFAULT_BRANCH..HEAD" > "$OUT/logs/unpushed.txt" 2>/dev/null || true
        fi
        {
          echo "### $SKILL (Claude Code)"
          [ -n "$TARGET" ] && echo "- 대상: $TARGET"
          echo "- claude exit: ${EXIT_CODE:-n/a}"
          python3 "$t" summary "$OUT/logs/transcript.jsonl" || true
          if [ -s "$OUT/logs/commits.txt" ]; then
            echo "- 이번 실행 커밋:"; sed 's/^/  - /' "$OUT/logs/commits.txt"
          else
            echo "- 이번 실행 커밋: 없음(대상 없음으로 종료했거나 점유 전에 끝남)"
          fi
          if [ -s "$OUT/logs/unpushed.txt" ]; then
            echo "- ⚠️ push되지 않은 커밋 $(wc -l < "$OUT/logs/unpushed.txt")개 — 원격에 반영 안 됨"
          fi
          if [ -s "$OUT/logs/final-message.md" ]; then
            echo; echo "<details><summary>최종 보고</summary>"; echo
            head -c 8000 "$OUT/logs/final-message.md"; echo; echo "</details>"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    # 대화 기록에는 스킬이 MCP로 받은 GitHub App 토큰(대상 레포)이 셸 명령에 옮겨 적혀 남는다 — 올리기 전에 가린다.
    - name: Redact secrets
      if: always()
      shell: bash
      env:
        HARNESS: ${{ inputs.harness-dir }}
        OUT: ${{ inputs.out-dir }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.oauth-token }}
      # OAuth 토큰은 패턴이 아니라 값 그대로(--extra-env) 가린다.
      run: python3 "$HARNESS/.github/scripts/redact_secrets.py" "$OUT" --extra-env SOURCE_GITHUB_TOKEN --extra-env CLAUDE_CODE_OAUTH_TOKEN

    - name: Upload run artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.out-dir }}
        if-no-files-found: warn
        retention-days: 14

    - name: Check result
      if: always()
      shell: bash
      env:
        HARNESS: ${{ inputs.harness-dir }}
        OUT: ${{ inputs.out-dir }}
        EXIT_CODE: ${{ steps.run.outputs.exit_code }}
        LIMITED: ${{ steps.limit.outputs.limited }}
        LIMIT_LABEL: ${{ steps.limit.outputs.limit_label }}
        RESETS: ${{ steps.limit.outputs.resets_local }}
      run: |
        fail=0
        # 한도 초과는 실패로 남기되 원인을 따로 적는다(점유가 남았을 수 있다 — 재설정 뒤 다음 실행이 이어받는다).
        if [ "$LIMITED" = "true" ]; then
          echo "::error title=Claude 사용 한도 초과::${LIMIT_LABEL:-사용 한도}로 중단${RESETS:+ — 재설정 $RESETS}"
        fi
        python3 "$HARNESS/.github/scripts/claude_transcript.py" check "$OUT/logs/transcript.jsonl" --mcp k3s || fail=1
        if [ "${EXIT_CODE:-1}" != "0" ]; then echo "::error::claude exit ${EXIT_CODE:-n/a} — logs/stderr.log 참고"; fail=1; fi
        if [ -s "$OUT/logs/unpushed.txt" ]; then echo "::error::스킬 checkout에 push되지 않은 커밋이 남음"; fail=1; fi
        exit $fail
