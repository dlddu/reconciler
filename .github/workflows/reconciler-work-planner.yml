# 계획 단계 — 러너가 대상을 고르고 점유한 뒤, plugin-marketplace의 고정 MiniMax 스킬
# (plugins/reconciler-data-plane, reconciler-work-planner)로 그 task 한 건의 계획·준비(PR)·실행 지침을 쓴다.
#
# 스킬은 여기서 만들지 않는다. 생성 → 검증은 reconciler-work-planner-skill-build.yml(수동 실행)의 몫이고,
# 통과한 생성본이 plugin-marketplace에 올라간 것만 쓴다(README 「계획 스킬 MiniMax 파이프라인」).
# 대상 선정·점유는 claim_plan_target.py(감지와 같은 근거 — README 「점유는 러너가 한다」), 스킬은 계획만.
# 실행 결과는 check_planner_result.py가 계약대로인지 점검한다.
#
# 점유·계획 커밋을 기본 브랜치에 push하고(contents: write), 스킬은 대상 레포에 브랜치·PR을 만든다(머지하지 않는다).
#
# 필요한 설정
#   environment llm-minimax의 secret MINIMAX_SUBSCRIPTION_KEY   MiniMax Token Plan subscription key (sk-cp-...)
#                                      레포 secret에는 두지 않는다 — README 「모델 키 격리」
#   vars.HOMELAB_K3S_MCP_URL / vars.HOMELAB_K3S_MCP_AUDIENCE / vars.MINIMAX_REGION  (선택)
#   서버 MCP_GITHUB_OIDC_RULES에 이 파일(.github/workflows/reconciler-work-planner.yml) 규칙:
#     github_app_installation_token(필수 — 대상 레포 contents·pull_requests 쓰기, plugin-marketplace 읽기),
#     resource_list, resource_get, api_resources, ping(권장)
#   plugin-marketplace의 plugins/reconciler-data-plane에 MiniMax 계획 스킬(skills/reconciler-work-planner)이 있어야 한다.
name: "Reconciler · Work Planner"
# 주기 실행(source=k3s-cron)은 제목으로 구분한다 — 아래 circuit-breaker가 이 제목으로 그 실행만 골라 센다.
run-name: ${{ inputs.source == 'k3s-cron' && 'Reconciler · Work Planner (k3s-cron)' || 'Reconciler · Work Planner' }}

on:
  # ── 주기 실행 ─────────────────────────────────────────────────────────────────────────────
  # 주기는 flux-cd-apps의 CronWorkflow(apps/reconciler-trigger)가 쥐고, 계획할 대상이 있을 때만(같은 select_plan_target.py로
  # 사전 확인) 이 워크플로를 source=k3s-cron으로 dispatch 한다 — 감지와 같은 구성(README 「계획 스킬 MiniMax 파이프라인」).
  # 아래 circuit-breaker job이 주기 실행의 연속 실패를 세어 이 워크플로를 스스로 끈다.
  workflow_dispatch:
    inputs:
      source:
        description: "실행 출처. k3s CronWorkflow는 'k3s-cron'을 넘긴다(circuit-breaker가 이 실행만 센다). 사람이 돌릴 땐 비워 둔다"
        required: false
        default: ""
      target_id:
        description: "계획할 대상 지목(rct_... task · tbm_... 모델 · tbm_.../rct_... — rct id가 여러 모델에 겹치면 마지막 형식). 비우면 자동 선정"
        required: false
        default: ""
      plugin_ref:
        description: "plugin-marketplace에서 가져올 ref(브랜치·태그·SHA). 비우면 main"
        required: false
        default: ""
      minimax_model:
        description: "mcode 모델 override(<provider>/<model>). 비우면 CLI 기본값"
        required: false
        default: ""

# concurrency 그룹을 두지 않는다 — 같은 워크플로를 여러 번 띄우면 병렬로 돈다.
# 같은 task 중복 점유·push 충돌은 러너의 compare-and-set 점유 커밋(claim_plan_target.py — status가 그대로인지
# 재확인 후 planning으로 push, 거절되면 새 상태에서 재확인해 재시도, 지면 다음 후보)이 막는다.
# 로컬 러너·다른 제공자 워크플로(스킬이 직접 점유)와의 경쟁도 같은 status CAS로 막힌다.

permissions:
  contents: write

env:
  PLUGIN_NAME: reconciler-data-plane
  SKILL_NAME: reconciler-work-planner
  MCODE_VERSION: latest
  MCP_URL: ${{ vars.HOMELAB_K3S_MCP_URL || 'https://homelab-k3s-mcp.llkm.nl/mcp' }}
  MCP_AUDIENCE: ${{ vars.HOMELAB_K3S_MCP_AUDIENCE || 'homelab-k3s-mcp' }}
  MCP_PROXY_PORT: "8765"

jobs:
  plan:
    name: Claim and plan
    runs-on: ubuntu-latest
    environment: llm-minimax # 모델 키는 이 environment에만 있다(README 「모델 키 격리」)
    timeout-minutes: 90
    permissions:
      contents: write # 점유·계획 커밋 push
      id-token: write # homelab-k3s-mcp OIDC
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false

      # 운영 데이터는 기본 브랜치가 진실이다. 워크플로 토큰을 남겨 점유 스크립트와 스킬이 push에 쓴다.
      - name: Checkout reconciler (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: ws/reconciler
          fetch-depth: 50

      - name: Prepare workspace
        run: |
          OUT="$RUNNER_TEMP/out"; echo "OUT=$OUT" >> "$GITHUB_ENV"
          mkdir -p "$OUT/logs" ws/targets
          git -C ws/reconciler config user.name "reconciler-bot"
          git -C ws/reconciler config user.email "reconciler@dlddu.dev"
          git config --global user.name "reconciler-bot"
          git config --global user.email "reconciler@dlddu.dev"
          pip install --quiet --disable-pip-version-check jsonschema

      # 대상 선정 + 점유(action_required · review_rejected · failed → planning compare-and-set 커밋, 즉시 push).
      # 선정은 레포 데이터만 읽으므로 MCP보다 먼저 한다 — 대상이 없으면 MCP·mcode를 띄우지 않는다.
      # task 파일이 깨져 판단할 수 없으면 "계획할 것 없음"으로 단정하지 않고 실패로 끝낸다.
      - name: Claim target
        id: claim
        env:
          INPUT_TARGET_ID: ${{ inputs.target_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 harness/.github/scripts/claim_plan_target.py --repo ws/reconciler --branch "$DEFAULT_BRANCH" \
            --target "$INPUT_TARGET_ID" --summary-file "$OUT/logs/claim.md"

      - name: Start homelab-k3s-mcp OIDC proxy
        if: steps.claim.outputs.claimed == 'true'
        run: |
          nohup python3 harness/.github/scripts/mcp_oidc_proxy.py --upstream "$MCP_URL" \
            --audience "$MCP_AUDIENCE" --port "$MCP_PROXY_PORT" > "$OUT/logs/mcp-proxy.log" 2>&1 &
          for _ in $(seq 1 30); do
            grep -q listening "$OUT/logs/mcp-proxy.log" && break
            if ! kill -0 $! 2>/dev/null; then cat "$OUT/logs/mcp-proxy.log"; echo "::error::프록시 기동 실패"; exit 1; fi
            sleep 1
          done
          echo "MCP_LOCAL_URL=http://127.0.0.1:$MCP_PROXY_PORT/mcp" >> "$GITHUB_ENV"

      - name: MCP preflight (tools/list)
        if: steps.claim.outputs.claimed == 'true'
        run: |
          # 서버가 재시작·기동 중(sablier cold start)이면 첫 요청이 실패할 수 있다 — 짧게 몇 번 다시 본다.
          for i in 1 2 3 4; do
            if python3 harness/.github/scripts/mcp_call.py --url "$MCP_LOCAL_URL" tools --json > "$OUT/logs/mcp-tools.json"; then
              echo "tools: $(cat "$OUT/logs/mcp-tools.json")"; exit 0
            fi
            [ "$i" -lt 4 ] && { echo "MCP 응답 없음 — $((i * 20))초 뒤 재시도($i/3)"; sleep $((i * 20)); }
          done
          cat "$OUT/logs/mcp-proxy.log"
          echo "::error::homelab-k3s-mcp 호출 실패 — audience나 서버 MCP_GITHUB_OIDC_RULES의 이 워크플로 규칙을 확인"
          exit 1

      # 고정 스킬: plugin-marketplace(private)의 plugins/<PLUGIN_NAME>을 mcode 로컬 플러그인으로 설치한다.
      - name: Fetch plugin package
        if: steps.claim.outputs.claimed == 'true'
        id: plugin
        env:
          PLUGIN_REF: ${{ inputs.plugin_ref || 'main' }}
        run: |
          python3 harness/.github/scripts/mcp_call.py --url "$MCP_LOCAL_URL" github-token \
            --env-name MARKETPLACE_TOKEN --repositories plugin-marketplace
          echo "ref=$PLUGIN_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout plugin-marketplace
        if: steps.claim.outputs.claimed == 'true'
        uses: actions/checkout@v4
        with:
          repository: dlddu/plugin-marketplace
          ref: ${{ steps.plugin.outputs.ref }}
          token: ${{ env.MARKETPLACE_TOKEN }}
          path: marketplace
          persist-credentials: false
          sparse-checkout: |
            plugins/${{ env.PLUGIN_NAME }}

      - name: Set up MiniMax Code
        if: steps.claim.outputs.claimed == 'true'
        uses: ./harness/.github/actions/setup-mcode
        with:
          subscription-key: ${{ secrets.MINIMAX_SUBSCRIPTION_KEY }}
          version: ${{ env.MCODE_VERSION }}
          region: ${{ vars.MINIMAX_REGION || 'en' }}

      - name: Install plugin into mcode
        if: steps.claim.outputs.claimed == 'true'
        id: install
        run: |
          src="marketplace/plugins/$PLUGIN_NAME"
          test -f "$src/.minimax-plugin/plugin.json" || { echo "::error::$src 에 MiniMax 플러그인이 없음"; exit 1; }
          test -f "$src/skills/$SKILL_NAME/SKILL.md" || {
            echo "::error::$src 에 MiniMax $SKILL_NAME 스킬이 없음 — 스킬 빌드 생성본을 plugin-marketplace에 올린 뒤 실행"; exit 1; }
          mkdir -p "$MINIMAX_DATA_DIR/plugins"
          cp -R "$src" "$MINIMAX_DATA_DIR/plugins/$PLUGIN_NAME"
          mcode plugin list --available --marketplace local --json > "$OUT/logs/plugins.json"
          python3 - "$OUT/logs/plugins.json" <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          name = os.environ["PLUGIN_NAME"]
          found = [p for p in json.load(open(sys.argv[1]))["installed"] if p["name"] == name]
          if not (found and found[0].get("enabled") and found[0]["capabilities"]["skillCount"] >= 1):
              sys.exit(f"::error::mcode가 {name} 플러그인을 인식하지 못함")
          print(f"version={found[0]['version']}")
          PY
          echo "commit=$(git -C marketplace rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "SKILL_DIR=$MINIMAX_DATA_DIR/plugins/$PLUGIN_NAME/skills/$SKILL_NAME" >> "$GITHUB_ENV"
          printf '{"mcpServers":{"k3s":{"type":"http","url":"%s"}}}\n' "$MCP_LOCAL_URL" > ws/.mcp.json

      - name: Run skill
        id: run
        if: steps.claim.outputs.claimed == 'true'
        env:
          MODEL: ${{ inputs.minimax_model }}
          TASK_ID: ${{ steps.claim.outputs.task_id }}
          MODEL_ID: ${{ steps.claim.outputs.model_id }}
          FROM_STATUS: ${{ steps.claim.outputs.from_status }}
          CLAIM_COMMIT: ${{ steps.claim.outputs.claim_commit }}
        run: |
          test "$(git -C ws/reconciler rev-parse HEAD)" = "$CLAIM_COMMIT"
          echo "base=$CLAIM_COMMIT" >> "$GITHUB_OUTPUT"
          sed -e "s#{{SKILL_DIR}}#$SKILL_DIR#g" -e "s#{{REPO_DIR}}#./reconciler#g" \
              -e "s#{{TASK_ID}}#$TASK_ID#g" -e "s#{{MODEL_ID}}#$MODEL_ID#g" \
              -e "s#{{FROM_STATUS}}#$FROM_STATUS#g" -e "s#{{CLAIM_COMMIT}}#$CLAIM_COMMIT#g" \
              -e "s#{{WORK_DIR}}#./targets#g" \
              harness/.github/minimax/work-planner-run-prompt.md > "$OUT/logs/prompt.md"
          sed -e "s#{{TASK_ID}}#$TASK_ID#g" -e "s#{{MODEL_ID}}#$MODEL_ID#g" -e "s#{{CLAIM_COMMIT}}#$CLAIM_COMMIT#g" \
              harness/.github/minimax/work-planner-resume-prompt.md > "$OUT/logs/resume-prompt.md"
          base_args=(exec --input - --cwd "$GITHUB_WORKSPACE/ws" --permission full
                --output-format stream-json
                --output-last-message "$OUT/logs/final-message.md"
                --diagnostics-dir "$OUT/logs/diagnostics")
          [ -n "$MODEL" ] && base_args+=(--model "$MODEL")
          # 재시도는 한 번, mcode가 재시도 가능한 오류(마지막 exec.completed의 error.retryable — 예: 제공자 upstream
          # 오류)로 끝났을 때만 한다. 그 밖의 실패는 그대로 결과 점검으로 넘긴다.
          # 재시도는 새로 시작하지 않고 1차 세션을 이어간다(--session) — 1차가 해 둔 조사·커밋·PR은 맥락에 남고,
          # 재시도 프롬프트가 현재 상태부터 다시 확인시켜 끝난 단계를 반복하지 않게 한다.
          # 시간: 1·2차를 합친 mcode 시간이 MCODE_BUDGET_SECONDS(기존 --timeout 70m)를 넘지 않게 2차의 --timeout을
          # 남은 예산으로 준다 — job timeout(90분)에 잘리면 결과 점검·아티팩트가 남지 않는다. 남은 예산이
          # MIN_RESUME_SECONDS보다 적으면 재시도하지 않는다.
          MCODE_BUDGET_SECONDS=4200
          MIN_RESUME_SECONDS=300
          remain=$MCODE_BUDGET_SECONDS
          prompt="$OUT/logs/prompt.md"
          session_args=()
          for attempt in 1 2; do
            started=$(date +%s)
            set +e
            env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL -u MARKETPLACE_TOKEN \
              mcode "${base_args[@]}" --timeout "${remain}s" "${session_args[@]}" \
              < "$prompt" > "$OUT/logs/transcript.jsonl" 2> "$OUT/logs/stderr.log"
            code=$?
            set -e
            remain=$(( remain - ($(date +%s) - started) ))
            tail -n 5 "$OUT/logs/stderr.log" || true
            [ "$code" -eq 0 ] && break
            [ "$attempt" -eq 1 ] || break
            read -r verdict session_id < <(python3 - "$OUT/logs/transcript.jsonl" <<'PY' 2>/dev/null || echo "unknown -"
          import json, sys
          rows = []
          for line in open(sys.argv[1], encoding="utf-8"):
              try:
                  rows.append(json.loads(line))
              except ValueError:
                  pass
          done = [r.get("result") or {} for r in rows if r.get("type") == "exec.completed"]
          sid = (done[-1].get("sessionId") if done else None) or next((r["sessionId"] for r in reversed(rows) if r.get("sessionId")), None)
          if not (done and (done[-1].get("error") or {}).get("retryable")):
              print("not-retryable", sid or "-")
          elif not sid:
              print("no-session -")
          else:
              print("retryable", sid)
          PY
            )
            if [ "$verdict" != retryable ]; then
              echo "재시도 안 함 — 판정: $verdict"; break
            fi
            if [ "$remain" -lt "$MIN_RESUME_SECONDS" ]; then
              echo "재시도 안 함 — 남은 mcode 예산 ${remain}s(< ${MIN_RESUME_SECONDS}s)"; break
            fi
            echo "::warning::mcode가 재시도 가능한 오류로 끝남 — 세션 $session_id 를 이어서 한 번 다시 돌린다(남은 예산 ${remain}s)"
            mv "$OUT/logs/transcript.jsonl" "$OUT/logs/transcript-attempt1.jsonl"
            mv "$OUT/logs/stderr.log" "$OUT/logs/stderr-attempt1.log"
            [ -d "$OUT/logs/diagnostics" ] && mv "$OUT/logs/diagnostics" "$OUT/logs/diagnostics-attempt1"
            prompt="$OUT/logs/resume-prompt.md"
            session_args=(--session "$session_id")
          done
          { echo "exit_code=$code"; echo "attempts=$attempt"; } >> "$GITHUB_OUTPUT"
          [ "$code" -eq 0 ] || echo "::warning::mcode가 exit $code로 끝남 — 결과 점검은 계속한다"

      # 계획이 계약대로 기록됐는지 확인한다(점유 이후 그 task 파일만 바뀜, 보존 필드·이전 attempts, 종료 상태).
      # planning으로 끝났으면(풀 수 없는 lock) 여기서 실패로 드러난다.
      - name: Check result
        if: steps.run.outcome != 'skipped' && steps.run.outputs.base != ''
        env:
          TASK_ID: ${{ steps.claim.outputs.task_id }}
          MODEL_ID: ${{ steps.claim.outputs.model_id }}
          FROM_STATUS: ${{ steps.claim.outputs.from_status }}
          CLAIM_MESSAGE: ${{ steps.claim.outputs.claim_message }}
          BASE: ${{ steps.run.outputs.base }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set +e
          python3 harness/.github/scripts/check_planner_result.py --repo ws/reconciler --base "$BASE" \
            --model-id "$MODEL_ID" --task-id "$TASK_ID" --from-status "$FROM_STATUS" --claim-subject "$CLAIM_MESSAGE" \
            --report "$OUT/check-report.md" --json "$OUT/check-report.json" --patch "$OUT/result.patch" \
            --task-out "$OUT/planned-task.json"
          code=$?
          set -e
          git -C ws/reconciler format-patch --stdout "origin/$DEFAULT_BRANCH..HEAD" > "$OUT/commits.patch" || true
          exit $code

      - name: Summary
        if: always()
        env:
          CLAIMED: ${{ steps.claim.outputs.claimed }}
          TASK_ID: ${{ steps.claim.outputs.task_id }}
          MODEL_ID: ${{ steps.claim.outputs.model_id }}
          FROM_STATUS: ${{ steps.claim.outputs.from_status }}
          LOST: ${{ steps.claim.outputs.lost_count }}
          PLUGIN_VERSION: ${{ steps.install.outputs.version }}
          PLUGIN_COMMIT: ${{ steps.install.outputs.commit }}
          RUN_EXIT: ${{ steps.run.outputs.exit_code }}
          RUN_ATTEMPTS: ${{ steps.run.outputs.attempts }}
        run: |
          {
            echo "### reconciler-work-planner"
            echo "- 점유: ${CLAIMED:-false} · task: ${MODEL_ID:+$MODEL_ID/}${TASK_ID:-<none>}${FROM_STATUS:+ ($FROM_STATUS → planning)} · 경쟁 패배 ${LOST:-0}건"
            [ -n "$PLUGIN_VERSION" ] && echo "- 스킬: $PLUGIN_NAME $PLUGIN_VERSION (plugin-marketplace \`${PLUGIN_COMMIT:0:7}\`)"
            echo "- mcode ${MCODE_INSTALLED_VERSION:-<미설치>} · exit: ${RUN_EXIT:-n/a} · 시도 ${RUN_ATTEMPTS:-n/a}회"
            if [ -s "$OUT/logs/transcript.jsonl" ]; then
              python3 harness/.github/scripts/mcode_transcript.py summary "$OUT/logs/transcript.jsonl"
            fi
            echo
            cat "$OUT/logs/claim.md" 2>/dev/null || true
            echo
            cat "$OUT/check-report.md" 2>/dev/null || true
            if [ -s "$OUT/logs/final-message.md" ]; then
              echo; echo "<details><summary>mcode 최종 보고</summary>"; echo
              head -c 6000 "$OUT/logs/final-message.md"; echo; echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # mcode가 MCP로 받은 대상 레포 토큰을 셸 명령에 옮겨 적으므로 대화 기록에 토큰이 남는다 — 올리기 전에 가린다.
      - name: Redact secrets
        if: always()
        run: python3 harness/.github/scripts/redact_secrets.py "$RUNNER_TEMP/out" --extra-env MARKETPLACE_TOKEN

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-planner-result
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
          retention-days: 14

  # ── 연속 실패 시 자동 비활성화 (주기 실행과 함께 켬) ──────────────────────────────────────────
  # GitHub는 실패 횟수로 워크플로를 끄지 않는다. 그래서 주기 실행(source=k3s-cron)이 실패하면 이 job이 최근 주기
  # 실행을 세어, FAILURE_THRESHOLD번 연속 실패면 이 워크플로를 끄고(gh workflow disable) PocketAide로 알린다.
  #   - 실패로 세는 것: 결론이 failure인 주기 실행(MCP 연결·MiniMax 오류·점유 오류·결과 점검 실패).
  #     대상 없음·점유 경쟁 패배는 성공으로 끝나므로 세지 않는다.
  #   - 주기 실행은 run-name 「Reconciler · Work Planner (k3s-cron)」으로 고른다. 사람의 수동 실행(source 비움)은
  #     세지도, 연속을 끊지도 않는다. 주기 실행 중간에 성공이나 취소가 한 번이라도 있으면 거기서 끊긴다.
  #   - 다시 켜기: Actions 화면의 Enable workflow 또는 `gh workflow enable reconciler-work-planner.yml`.
  #   - 알림은 homelab-k3s-mcp OIDC 규칙의 이 워크플로 규칙에 있는 pocket_aide_notification_send로 보낸다(그 규칙에
  #     도구가 없으면 경고만 남는다). 알림이 실패해도 비활성화는 이미 끝난 뒤다.
  #
  circuit-breaker:
    name: Disable after repeated scheduled failures
    needs: [plan]
    if: failure() && inputs.source == 'k3s-cron'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write   # 워크플로 비활성화
      id-token: write  # PocketAide 알림(homelab-k3s-mcp OIDC)
    env:
      FAILURE_THRESHOLD: "3"
      WORKFLOW_FILE: reconciler-work-planner.yml
    steps:
      - name: Count consecutive scheduled failures
        id: count
        env:
          GH_TOKEN: ${{ github.token }}
          PERIODIC_TITLE: "Reconciler · Work Planner (k3s-cron)"
        run: |
          # 이 실행은 아직 진행 중이라 목록에 없다 → 1부터 세고, 완료된 이전 주기 실행을 최신순으로 이어서 센다.
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs?event=workflow_dispatch&status=completed&per_page=50" \
            --jq '.workflow_runs[] | select(.display_title == env.PERIODIC_TITLE) | .conclusion' > previous.txt
          n=1
          while read -r conclusion; do
            [ "$conclusion" = failure ] || break
            n=$((n + 1))
          done < previous.txt
          echo "consecutive=$n" >> "$GITHUB_OUTPUT"
          echo "연속 주기 실행 실패: $n / $FAILURE_THRESHOLD"

      - name: Disable workflow
        id: disable
        if: fromJSON(steps.count.outputs.consecutive) >= fromJSON(env.FAILURE_THRESHOLD)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow disable "$WORKFLOW_FILE" -R "$GITHUB_REPOSITORY"
          echo "### 🚫 ${{ steps.count.outputs.consecutive }}회 연속 주기 실행 실패 — 워크플로 비활성화" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout harness
        if: steps.disable.outcome == 'success'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github

      - name: Notify PocketAide
        if: steps.disable.outcome == 'success'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COUNT: ${{ steps.count.outputs.consecutive }}
        run: |
          nohup python3 .github/scripts/mcp_oidc_proxy.py --upstream "$MCP_URL" --audience "$MCP_AUDIENCE" \
            --port "$MCP_PROXY_PORT" > proxy.log 2>&1 &
          for _ in $(seq 1 30); do grep -q listening proxy.log && break; sleep 1; done
          args=$(python3 - <<'PY'
          import json, os
          body = "주기 실행 %s회 연속 실패로 워크플로를 껐습니다. 마지막 실패: %s" % (os.environ["COUNT"], os.environ["RUN_URL"])
          print(json.dumps({"title": "reconciler work-planner 자동 비활성화", "body": body,
                            "requester": "reconciler-work-planner 워크플로 circuit-breaker"}, ensure_ascii=False))
          PY
          )
          python3 .github/scripts/mcp_call.py --url "http://127.0.0.1:$MCP_PROXY_PORT/mcp" \
            call pocket_aide_notification_send --args "$args" || echo "::warning::PocketAide 알림 실패(비활성화는 완료)"
