# 계획 단계 — reconciler-work-planner 스킬 실행
# action_required(또는 재작업 대상) task 한 건에 대해 계획·준비(PR)·실행 지침을 작성한다.
# 뼈대만 있음: 실제 스킬 실행 로직은 "Run skill" 스텝에 구현한다.
name: "Reconciler · Work Planner"

on:
  workflow_dispatch:
    inputs:
      target_id:
        description: "계획할 대상 지목(rct_... task · tbm_... 모델 · tbm_.../rct_... — rct id가 여러 모델에 겹치면 마지막 형식). 비우면 자동 선정"
        required: false
        default: ""

# concurrency 그룹을 두지 않는다 — 같은 워크플로를 여러 번 띄우면 병렬로 돈다.
# 같은 task 중복 점유·push 충돌은 스킬의 status compare-and-set 점유 커밋(pull --rebase → 상태 재확인 →
# 점유 push, 지면 물러남)이 막는다. 로컬 러너·다른 제공자 워크플로와의 경쟁도 같은 규약으로 막는다.

permissions:
  contents: write
  id-token: write # OIDC 토큰 발급

jobs:
  run:
    name: Run reconciler-work-planner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SKILL_NAME: reconciler-work-planner
    steps:
      - name: Checkout reconciler
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # TODO: OIDC 토큰 발급 (audience 지정 후 필요한 자격 증명으로 교환)
      - name: Request OIDC token
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL" && test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            || { echo "OIDC 토큰 요청 환경이 없습니다 (id-token: write 권한 확인)"; exit 1; }
          echo "TODO: request OIDC token for $SKILL_NAME"

      # TODO: 스킬 실행에 필요한 런타임·CLI·자격 증명 준비 (예: Python, 대상 레포 토큰, 클러스터 접근)
      - name: Set up runtime
        run: |
          echo "TODO: set up runtime for $SKILL_NAME"

      # 스킬 Step 0(대상 선정 · 진입 게이트)을 그대로 옮긴 읽기 전용 선정 — 기준은 reconciler-local
      # 타이머 게이트(planner/precheck-plan.py)와 같다. 계획 대상 = 미점유 인수인계 지점
      # (action_required · review_rejected · failed)에 있고 모델이 꺼져 있지 않은(enabled:false 아님) task.
      # planning은 집지 않는다(새 러너는 resume할 lock이 없고, 버려진 lock을 구별할 수 없다).
      # single in-flight: 지목이 없으면 인수인계 지점에 가장 오래 머문 한 건만 고른다.
      # 레포에 쓰지 않는다 — action_required → planning 점유 커밋은 스킬 Step 1 몫.
      # task 파일이 깨져 판단할 수 없으면 "계획할 것 없음"으로 단정하지 않고 실패로 끝낸다.
      - name: Select target
        id: select
        env:
          INPUT_TARGET_ID: ${{ inputs.target_id }}
        run: |
          python3 .github/scripts/select_plan_target.py \
            --repo "$GITHUB_WORKSPACE" --target "$INPUT_TARGET_ID" \
            --summary-file "$RUNNER_TEMP/select-target.md"

      # TODO: 고른 대상에 대해 스킬 실행.
      - name: Run skill
        if: steps.select.outputs.found == 'true'
        env:
          TARGET_ID: ${{ steps.select.outputs.target_id }}
          MODEL_ID: ${{ steps.select.outputs.model_id }}
          FROM_STATUS: ${{ steps.select.outputs.from_status }}
          SELECT_REASON: ${{ steps.select.outputs.reason }}
        run: |
          echo "skill:     $SKILL_NAME"
          echo "target_id: $MODEL_ID/$TARGET_ID ($FROM_STATUS, $SELECT_REASON)"
          echo "TODO: implement $SKILL_NAME execution"

      - name: Summary
        if: always()
        env:
          TARGET_ID: ${{ steps.select.outputs.target_id }}
          FOUND: ${{ steps.select.outputs.found }}
          FROM_STATUS: ${{ steps.select.outputs.from_status }}
        run: |
          {
            echo "### $SKILL_NAME"
            echo "- target found: ${FOUND:-false}"
            echo "- target_id: ${TARGET_ID:-<none>}${FROM_STATUS:+ ($FROM_STATUS)}"
            echo "- result: TODO"
            echo
            cat "$RUNNER_TEMP/select-target.md" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
