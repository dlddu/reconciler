# 리뷰 스킬 빌드 — MiniMax Code(mcode)로 reconciler-work-review 스킬을 생성 → 검증한다.
# 뼈대만 있음: job·스텝 순서와 경계만 잡고, 스킬별 로직은 TODO로 남긴다. 완성 형태는
# reconciler-drift-detector-skill-build.yml을 따른다(README 「감지 스킬 MiniMax 파이프라인」).
#
# 스킬 생성은 자동화 대상이 아니다: 지침이나 계약을 바꿀 때 사람이 수동으로 돌리고, 통과한 생성본
# (work-review-skill 아티팩트)을 plugin-marketplace의 plugins/reconciler-data-plane 에 PR로 올린다.
#
#   generate  간결한 지침(.github/minimax/work-review-brief.md — TODO: 작성)만 주고 mcode가 레포를 직접 읽어
#             SKILL.md를 작성한다. 기존 스킬 본문은 모델에 노출하지 않는다.
#   validate  생성물 정적 검증(형식 · 리뷰 단계 계약 커버리지 · 금지 패턴 · 보조 스크립트 문법).
#
# 필요한 설정(구현 시)
#   environment llm-minimax의 secret MINIMAX_SUBSCRIPTION_KEY   레포 secret에는 두지 않는다 — README 「모델 키 격리」
#   vars.MINIMAX_REGION   (선택) 감지 스킬 빌드와 같다
name: "Reconciler · Work Review Skill Build"

on:
  workflow_dispatch:
    inputs:
      minimax_model:
        description: "mcode 모델 override(<provider>/<model>, 예: minimax/MiniMax-M3). 비우면 CLI 기본값"
        required: false
        default: ""

# concurrency 그룹을 두지 않는다 — 빌드는 레포에 쓰지 않고(contents: read) 결과는 실행별 아티팩트라
# 병렬로 돌아도 서로 겹치지 않는다.

permissions:
  contents: read

env:
  SKILL_NAME: reconciler-work-review
  SKILL_REL: .agents/skills/reconciler-work-review # mcode 워크스페이스(ws/) 기준 스킬 위치
  MCODE_VERSION: latest

jobs:
  generate:
    name: Generate skill (MiniMax Code)
    runs-on: ubuntu-latest
    environment: llm-minimax # 모델 키는 이 environment에만 있다(README 「모델 키 격리」)
    timeout-minutes: 30
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false

      # 스킬을 레포 밖(ws/.agents)에 쓰게 해 reconciler 체크아웃을 오염시키지 않는다.
      - name: Checkout reconciler (reference)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: ws/reconciler
          persist-credentials: false

      # TODO: ./harness/.github/actions/setup-mcode (subscription-key: secrets.MINIMAX_SUBSCRIPTION_KEY)
      - name: Set up MiniMax Code
        run: |
          echo "TODO: set up mcode for $SKILL_NAME"

      # TODO: .github/minimax/work-review-brief.md 작성 후 감지 스킬 빌드의 Generate SKILL.md와 같은 방식으로 실행.
      #   brief에 담을 계약: planned → reviewing 점유는 러너 몫, 계획이 gap을 좁히는지 · PR 유효성 · 위험 통제 근거로
      #   reviewing → approved | review_rejected, 사람 승인 status가 필요하면 approved + review.manualApproval(sha·context)
      #   (사람 승인 대기 상태로 보내지 않음), 실행하지 않음, 스키마 수정 금지.
      - name: Generate SKILL.md
        id: gen
        env:
          MODEL: ${{ inputs.minimax_model }}
        run: |
          echo "TODO: generate $SKILL_NAME SKILL.md into ws/$SKILL_REL"

      # TODO: ws/reconciler가 깨끗한지, ws/$SKILL_REL/SKILL.md가 생겼는지 확인.
      - name: Check reference checkout untouched
        run: |
          echo "TODO: check ws/reconciler untouched and SKILL.md exists"

      # TODO: 생성본·대화 기록을 $RUNNER_TEMP/out으로 모으고 redact_secrets.py로 가린 뒤
      #   work-review-skill 아티팩트로 올린다.
      - name: Collect, redact and upload skill
        if: always()
        run: |
          echo "TODO: collect → redact → upload work-review-skill"

      - name: Summary
        if: always()
        run: |
          {
            echo "### 1. Generate — $SKILL_NAME"
            echo "- result: TODO"
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Validate skill
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
          sparse-checkout: .github

      # TODO: work-review-skill 아티팩트 다운로드.
      - name: Download skill
        run: |
          echo "TODO: download work-review-skill"

      # TODO: validate_generated_skill.py는 지금 감지 스킬 전용(EXPECTED_NAME·REQUIRED가 하드코딩)이다.
      #   스킬별 계약 표(reviewing/approved/review_rejected, review·manualApproval, 실행·머지 금지)를
      #   받도록 일반화한 뒤 여기서 돌리고, 보고서를 work-review-validation 아티팩트로 올린다.
      - name: Static validation
        run: |
          echo "TODO: validate $SKILL_NAME"

      - name: Summary
        if: always()
        run: |
          {
            echo "### 2. Validate — $SKILL_NAME"
            echo "- result: TODO"
          } >> "$GITHUB_STEP_SUMMARY"
