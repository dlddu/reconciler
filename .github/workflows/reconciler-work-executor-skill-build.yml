# 실행 스킬 빌드 — MiniMax Code(mcode)로 reconciler-work-executor 스킬을 생성 → 검증 → 테스트한다.
#
# 스킬 생성은 자동화 대상이 아니다: 지침(.github/minimax/work-executor-brief*.md)이나 계약을 바꿀 때 사람이
# 수동으로 돌리고, 통과한 생성본(work-executor-skill 아티팩트)을 plugin-marketplace의
# plugins/reconciler-data-plane 에 PR로 올린다(README 「실행 스킬 MiniMax 파이프라인」).
#
#   generate  지침만 주고 mcode가 레포를 직접 읽어 SKILL.md를 작성한다. 기존 스킬 본문은 모델에 노출하지 않는다.
#             지침 = 메인(work-executor-brief.md, 핵심 규칙) + 서브(work-executor-brief-sub.md, 품질 보조 규칙)를
#             이 순서로 이어 한 프롬프트로 준다.
#   validate  생성물 정적 검증(형식 · 실행 단계 계약 커버리지 · 금지 패턴 · 보조 스크립트 문법) — --profile reconciler-work-executor.
#   test      실행 단계는 PR 머지·클러스터 변경처럼 되돌리기 어려운 일을 하므로 운영 데이터로 시험하지 않는다.
#             executor_fixture.py가 러너 안에 격리 무대(로컬 bare 대상 저장소 + 로컬 reconciler 원격 + 점유된 task)를
#             만들고, 생성본을 운영과 같은 실행 프롬프트로 mcode에 돌린 뒤 check_executor_result.py가 계약과
#             시나리오 기대값을 점검한다. GitHub·MCP·클러스터 자격 증명은 주지 않는다.
#               merge           준비 브랜치 병합 → 검증 통과 → succeeded
#               broken-premise  리뷰 뒤 준비 브랜치가 사라짐 → 아무것도 바꾸지 않고 failed
#   report    세 단계 결과를 한 보고서(work-executor-build-report 아티팩트)로 묶는다.
#
# 필요한 설정
#   environment llm-minimax의 secret MINIMAX_SUBSCRIPTION_KEY   MiniMax Token Plan subscription key (sk-cp-...)
#                                      레포 secret에는 두지 않는다 — README 「모델 키 격리」
#   vars.MINIMAX_REGION                (선택) en(기본, api.minimax.io) | cn
name: "Reconciler · Work Executor Skill Build"

on:
  workflow_dispatch:
    inputs:
      minimax_model:
        description: "mcode 모델 override(<provider>/<model>, 예: minimax/MiniMax-M3). 비우면 CLI 기본값"
        required: false
        default: ""

# concurrency 그룹을 두지 않는다 — 빌드는 레포에 쓰지 않고(contents: read) 결과는 실행별 아티팩트라
# 병렬로 돌아도 서로 겹치지 않는다.

permissions:
  contents: read

env:
  SKILL_NAME: reconciler-work-executor
  SKILL_REL: .agents/skills/reconciler-work-executor # mcode 워크스페이스(ws/) 기준 스킬 위치
  MCODE_VERSION: latest # npm dist-tag — 실제 설치된 버전은 Set up MiniMax Code 출력·요약에 남는다

jobs:
  generate:
    name: Generate skill (MiniMax Code)
    runs-on: ubuntu-latest
    environment: llm-minimax # 모델 키는 이 environment에만 있다(README 「모델 키 격리」)
    timeout-minutes: 30
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false

      # mcode 워크스페이스: ws/ 아래에 reconciler(읽기 참고용)와 스킬 출력 위치를 둔다.
      # 스킬을 레포 밖(ws/.agents)에 쓰게 해 reconciler 체크아웃을 오염시키지 않는다.
      - name: Checkout reconciler (reference)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: ws/reconciler
          persist-credentials: false

      - name: Set up MiniMax Code
        uses: ./harness/.github/actions/setup-mcode
        with:
          subscription-key: ${{ secrets.MINIMAX_SUBSCRIPTION_KEY }}
          version: ${{ env.MCODE_VERSION }}
          region: ${{ vars.MINIMAX_REGION || 'en' }}

      - name: Generate SKILL.md
        id: gen
        env:
          MODEL: ${{ inputs.minimax_model }}
        run: |
          out="$RUNNER_TEMP/out"; mkdir -p "$out/logs" "$GITHUB_WORKSPACE/ws/$SKILL_REL"
          for f in work-executor-brief.md work-executor-brief-sub.md; do
            test -f "harness/.github/minimax/$f" || { echo "::error::지침 파일 없음: $f"; exit 1; }
          done
          {
            cat harness/.github/minimax/work-executor-brief.md
            printf '\n\n---\n\n'
            cat harness/.github/minimax/work-executor-brief-sub.md
          } | sed -e "s#{{SKILL_DIR}}#$SKILL_REL#g" -e "s#{{REPO_DIR}}#./reconciler#g" > "$out/logs/prompt.md"
          echo "brief: $(wc -c < "$out/logs/prompt.md") bytes"
          args=(exec --input - --cwd "$GITHUB_WORKSPACE/ws" --permission full
                --output-format stream-json --timeout 25m
                --output-last-message "$out/logs/final-message.md"
                --diagnostics-dir "$out/logs/diagnostics")
          [ -n "$MODEL" ] && args+=(--model "$MODEL")
          set +e
          env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
            mcode "${args[@]}" < "$out/logs/prompt.md" > "$out/logs/transcript.jsonl" 2> "$out/logs/stderr.log"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 5 "$out/logs/stderr.log" || true
          [ "$code" -eq 0 ] || { echo "::error::mcode 생성 실행 실패(exit $code) — logs/stderr.log 참고"; exit "$code"; }

      - name: Check reference checkout untouched
        run: |
          changes=$(git -C ws/reconciler status --porcelain)
          if [ -n "$changes" ]; then
            echo "::error::생성 단계가 reconciler 체크아웃을 수정함"; echo "$changes"; exit 1
          fi
          test -f "ws/$SKILL_REL/SKILL.md" || { echo "::error::SKILL.md가 생성되지 않음"; exit 1; }

      - name: Collect skill
        if: always()
        run: |
          out="$RUNNER_TEMP/out"; mkdir -p "$out/skill"
          cp -R "ws/$SKILL_REL/." "$out/skill/" 2>/dev/null || true
          {
            echo "### 1. Generate — $SKILL_NAME"
            echo "- mcode ${MCODE_INSTALLED_VERSION:-<미설치>} · exit: ${{ steps.gen.outputs.exit_code || 'n/a' }}"
            echo "- 생성 파일: $(cd "$out/skill" && find . -type f | sed 's#^\./##' | paste -sd ', ' -)"
            python3 harness/.github/scripts/mcode_transcript.py summary "$out/logs/transcript.jsonl" 2>/dev/null || true
          } | tee "$out/generate-summary.md" >> "$GITHUB_STEP_SUMMARY"

      # 대화 기록에는 도구 결과로 받은 토큰이 남을 수 있다 — 올리기 전에 가린다.
      - name: Redact secrets
        if: always()
        run: python3 harness/.github/scripts/redact_secrets.py "$RUNNER_TEMP/out"

      - name: Upload skill artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-executor-skill
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
          retention-days: 14

  validate:
    name: Validate skill
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
          sparse-checkout: .github

      - name: Download skill
        uses: actions/download-artifact@v4
        with:
          name: work-executor-skill
          path: ${{ runner.temp }}/gen

      - name: Static validation
        run: |
          mkdir -p "$RUNNER_TEMP/validation"
          set +e
          python3 harness/.github/scripts/validate_generated_skill.py "$RUNNER_TEMP/gen/skill" \
            --profile "$SKILL_NAME" \
            --report "$RUNNER_TEMP/validation/report.md" --json "$RUNNER_TEMP/validation/report.json"
          code=$?
          set -e
          cat "$RUNNER_TEMP/validation/report.md" >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-executor-validation
          path: ${{ runner.temp }}/validation
          if-no-files-found: warn
          retention-days: 14

  test:
    name: Test skill (${{ matrix.scenario }})
    needs: validate
    runs-on: ubuntu-latest
    environment: llm-minimax # 모델 키는 이 environment에만 있다(README 「모델 키 격리」)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario: [merge, broken-premise]
    steps:
      # README·schemas·scripts 원본. 픽스처는 이것을 복사해 쓰고, 이 체크아웃 자체는 건드리지 않는다.
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false

      - name: Download skill
        uses: actions/download-artifact@v4
        with:
          name: work-executor-skill
          path: ${{ runner.temp }}/gen

      # 격리 무대: GitHub·MCP·클러스터 없이 로컬 bare 저장소만으로 점유된 task 한 건을 실행하게 한다.
      # 정답지 봉인: 기대값(expect.json)과 테스트 하네스(점검기·픽스처·검증기)는 root 소유 700 디렉터리로 옮겨
      # 실행 중인 mcode(러너 사용자)가 읽지 못하게 하고, 실행 뒤에 푼다. 그래도 들여다봤는지는 Check isolation이 본다.
      - name: Build fixture
        id: fx
        run: |
          OUT="$RUNNER_TEMP/out"; SEALED="$RUNNER_TEMP/sealed"
          { echo "OUT=$OUT"; echo "SEALED=$SEALED"; } >> "$GITHUB_ENV"
          mkdir -p "$OUT/logs" "$SEALED"
          pip install --quiet --disable-pip-version-check jsonschema
          # 로컬 대상 저장소 병합 커밋용 작성자(운영에서는 GitHub가 머지 커밋을 만든다).
          git config --global user.name "reconciler-bot"
          git config --global user.email "reconciler@dlddu.dev"
          python3 harness/.github/scripts/executor_fixture.py --source harness --work-dir "$RUNNER_TEMP/fx" \
            --scenario "${{ matrix.scenario }}" --expect-file "$SEALED/expect.json" --github-output "$GITHUB_OUTPUT"
          ws="$RUNNER_TEMP/fx/ws"
          mkdir -p "$ws/$SKILL_REL"
          cp -R "$RUNNER_TEMP/gen/skill/." "$ws/$SKILL_REL/"
          test -f "$ws/$SKILL_REL/SKILL.md" || { echo "::error::내려받은 생성본에 SKILL.md가 없음"; exit 1; }
          for f in check_executor_result.py check_detector_result.py executor_fixture.py validate_generated_skill.py; do
            mv "harness/.github/scripts/$f" "$SEALED/$f"
          done
          sudo chown -R root:root "$SEALED"
          sudo chmod -R go-rwx "$SEALED"
          if cat "$SEALED/expect.json" >/dev/null 2>&1; then echo "::error::봉인 실패 — 러너 사용자가 기대값을 읽을 수 있음"; exit 1; fi

      - name: Set up MiniMax Code
        uses: ./harness/.github/actions/setup-mcode
        with:
          subscription-key: ${{ secrets.MINIMAX_SUBSCRIPTION_KEY }}
          version: ${{ env.MCODE_VERSION }}
          region: ${{ vars.MINIMAX_REGION || 'en' }}

      # 운영 실행과 같은 프롬프트(work-executor-run-prompt.md). 이 무대에만 해당하는 사실은 ENV_NOTE 한 줄뿐이다.
      # mcode 런타임이 재시도 가능한 오류(예: EMPTY_RESPONSE)로 끝났고 아직 아무것도 바뀌지 않았으면
      # (reconciler HEAD = 점유 커밋·작업 트리 깨끗·대상 refs 그대로) 한 번만 처음부터 다시 돌린다.
      - name: Run skill
        id: run
        env:
          MODEL: ${{ inputs.minimax_model }}
          WS: ${{ steps.fx.outputs.ws_dir }}
          REPO: ${{ steps.fx.outputs.repo_dir }}
          TARGET: ${{ steps.fx.outputs.target_git_dir }}
          TASK_ID: ${{ steps.fx.outputs.task_id }}
          MODEL_ID: ${{ steps.fx.outputs.model_id }}
          CLAIM_COMMIT: ${{ steps.fx.outputs.claim_commit }}
          ENV_NOTE: "이번 실행 환경에는 MCP 서버가 연결돼 있지 않다. 대상 저장소는 task의 plan·preparation에 적힌 로컬 경로다."
        run: |
          sed -e "s#{{SKILL_DIR}}#$SKILL_REL#g" -e "s#{{REPO_DIR}}#./reconciler#g" \
              -e "s#{{TASK_ID}}#$TASK_ID#g" -e "s#{{MODEL_ID}}#$MODEL_ID#g" \
              -e "s#{{CLAIM_COMMIT}}#$CLAIM_COMMIT#g" -e "s#{{ENV_NOTE}}#$ENV_NOTE#g" \
              harness/.github/minimax/work-executor-run-prompt.md > "$OUT/logs/prompt.md"
          args=(exec --input - --cwd "$WS" --permission full
                --output-format stream-json --timeout 25m
                --output-last-message "$OUT/logs/final-message.md"
                --diagnostics-dir "$OUT/logs/diagnostics")
          [ -n "$MODEL" ] && args+=(--model "$MODEL")
          refs() { git --git-dir "$TARGET" for-each-ref --format='%(refname) %(objectname)'; }
          pre_refs=$(refs)
          for attempt in 1 2; do
            set +e
            env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_RUNTIME_TOKEN \
                -u GITHUB_TOKEN -u GH_TOKEN \
              mcode "${args[@]}" < "$OUT/logs/prompt.md" > "$OUT/logs/transcript.jsonl" 2> "$OUT/logs/stderr.log"
            code=$?
            set -e
            tail -n 5 "$OUT/logs/stderr.log" || true
            [ "$code" -eq 0 ] && break
            retryable=$(python3 -c 'import json,sys
          r=[json.loads(l) for l in open(sys.argv[1]) if l.startswith("{")]
          e=[x.get("result",{}).get("error") or {} for x in r if x.get("type")=="exec.completed"]
          print("yes" if e and e[-1].get("retryable") else "no")' "$OUT/logs/transcript.jsonl" 2>/dev/null || echo no)
            untouched=no
            if [ "$(git -C "$REPO" rev-parse HEAD)" = "$CLAIM_COMMIT" ] && [ -z "$(git -C "$REPO" status --porcelain)" ] \
               && [ "$(refs)" = "$pre_refs" ]; then untouched=yes; fi
            if [ "$attempt" -eq 1 ] && [ "$retryable" = yes ] && [ "$untouched" = yes ]; then
              echo "::warning::mcode가 재시도 가능한 오류로 끝났고 바뀐 것이 없음 — 한 번 다시 돌린다"
              mv "$OUT/logs/transcript.jsonl" "$OUT/logs/transcript-attempt1.jsonl"
              mv "$OUT/logs/stderr.log" "$OUT/logs/stderr-attempt1.log"
              continue
            fi
            break
          done
          { echo "exit_code=$code"; echo "attempts=$attempt"; } >> "$GITHUB_OUTPUT"
          [ "$code" -eq 0 ] || echo "::warning::mcode가 exit $code로 끝남 — 결과 점검은 계속한다"

      - name: Unseal answer key
        if: always() && steps.fx.outcome == 'success'
        run: sudo chown -R "$(id -u):$(id -g)" "$SEALED"

      # 시험 대상이 정답지(기대값·점검기·픽스처)를 건드렸으면 결과와 무관하게 이 테스트는 무효다.
      - name: Check isolation
        id: isolation
        if: steps.run.outcome == 'success'
        run: |
          code=0
          for t in "$OUT"/logs/transcript*.jsonl; do
            python3 harness/.github/scripts/mcode_transcript.py forbid "$t" "$SEALED" sealed/ expect.json \
              check_executor_result check_detector_result executor_fixture validate_generated_skill \
              | tee -a "$OUT/isolation.txt" || code=1
          done
          [ "$code" -eq 0 ] || echo "::error::시험 대상이 정답지를 들여다봄 — 이 테스트 결과는 무효"
          exit $code

      - name: Check result
        if: always() && steps.run.outcome == 'success'
        env:
          REPO: ${{ steps.fx.outputs.repo_dir }}
          TASK_ID: ${{ steps.fx.outputs.task_id }}
          MODEL_ID: ${{ steps.fx.outputs.model_id }}
          CLAIM_COMMIT: ${{ steps.fx.outputs.claim_commit }}
          CLAIM_MESSAGE: ${{ steps.fx.outputs.claim_message }}
          EXPECT: ${{ steps.fx.outputs.expect_file }}
          TARGET: ${{ steps.fx.outputs.target_git_dir }}
        run: |
          set +e
          cp "$EXPECT" "$OUT/expect.json"
          python3 "$SEALED/check_executor_result.py" --repo "$REPO" --base "$CLAIM_COMMIT" \
            --model-id "$MODEL_ID" --task-id "$TASK_ID" --claim-subject "$CLAIM_MESSAGE" \
            --expect "$EXPECT" --require-pushed \
            --report "$OUT/check-report.md" --json "$OUT/check-report.json" --patch "$OUT/result.patch"
          code=$?
          set -e
          git -C "$REPO" format-patch --stdout "$CLAIM_COMMIT..HEAD" > "$OUT/commits.patch" 2>/dev/null || true
          git -C "$REPO" log --format='%h %s' -10 > "$OUT/reconciler-log.txt" || true
          git --git-dir "$TARGET" log --all --graph --format='%h %d %s' > "$OUT/target-log.txt" || true
          cp "$REPO/data/reconciliation-tasks/$MODEL_ID.json" "$OUT/task-after.json" || true
          exit $code

      - name: Summary
        if: always()
        env:
          RUN_EXIT: ${{ steps.run.outputs.exit_code }}
          ATTEMPTS: ${{ steps.run.outputs.attempts }}
        run: |
          {
            echo "### 3. Test — ${{ matrix.scenario }}"
            echo "- mcode ${MCODE_INSTALLED_VERSION:-<미설치>} · exit: ${RUN_EXIT:-n/a} · 시도 ${ATTEMPTS:-n/a}회"
            if grep -q "forbidden references: [1-9]" "$OUT/isolation.txt" 2>/dev/null; then
              echo "- ❌ 격리 위반 — 시험 대상이 정답지를 들여다봄(결과 무효)"
            fi
            if [ -s "$OUT/logs/transcript.jsonl" ]; then
              python3 harness/.github/scripts/mcode_transcript.py summary "$OUT/logs/transcript.jsonl"
            fi
            echo
            cat "$OUT/check-report.md" 2>/dev/null || echo "_결과 점검 보고서 없음_"
            if [ -s "$OUT/logs/final-message.md" ]; then
              echo; echo "<details><summary>mcode 최종 보고</summary>"; echo
              head -c 6000 "$OUT/logs/final-message.md"; echo; echo "</details>"
            fi
          } | tee "$OUT/test-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Redact secrets
        if: always()
        run: python3 harness/.github/scripts/redact_secrets.py "$RUNNER_TEMP/out"

      - name: Upload test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-executor-test-${{ matrix.scenario }}
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
          retention-days: 14

  report:
    name: Build report
    needs: [generate, validate, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/in

      - name: Compose report
        env:
          GENERATE: ${{ needs.generate.result }}
          VALIDATE: ${{ needs.validate.result }}
          TEST: ${{ needs.test.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          in="$RUNNER_TEMP/in"; out="$RUNNER_TEMP/report"; mkdir -p "$out"
          {
            echo "# $SKILL_NAME 스킬 빌드 보고서"
            echo
            echo "- 실행: $RUN_URL (\`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA:0:7}\`)"
            echo "- generate **$GENERATE** · validate **$VALIDATE** · test **$TEST**"
            echo
            cat "$in/work-executor-skill/generate-summary.md" 2>/dev/null || echo "_generate 요약 없음_"
            echo
            echo "### 2. Validate"
            cat "$in/work-executor-validation/report.md" 2>/dev/null || echo "_검증 보고서 없음_"
            for d in "$in"/work-executor-test-*; do
              [ -d "$d" ] || continue
              echo
              cat "$d/test-summary.md" 2>/dev/null || echo "_${d##*/} 요약 없음_"
            done
          } > "$out/report.md"
          cp -R "$in/work-executor-skill/skill" "$out/skill" 2>/dev/null || true
          cat "$out/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: work-executor-build-report
          path: ${{ runner.temp }}/report
          if-no-files-found: warn
          retention-days: 14
