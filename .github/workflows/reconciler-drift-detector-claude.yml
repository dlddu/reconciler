# 감지 단계 — Claude Code로 reconciler-drift-detector 스킬 실행
# (MiniMax 파이프라인 reconciler-drift-detector.yml과 별개 파일. 그 파일은 건드리지 않는다.)
# 버전이 바뀐(또는 수동 트리거된) ToBeModel 한 건을 assessing으로 점유해 as-is/to-be 차이와 작업 필요 여부를 판정한다.
#
# 흐름(reconciler-local의 run-drift-detector.sh와 같다): 싼 게이트(Select target)가 감지 후보를 확인했을 때만
# 비싼 claude 실행을 띄운다. 점유·판정·커밋·push는 스킬이 한다(reconciler-repo-access 규약). reconciler push는
# 러너가 체크아웃해 둔 워크플로 토큰(contents: write — .github/workflows는 못 바꾼다)으로, 대상 레포는 MCP App 토큰으로.
# 게이트가 대상을 못 정하면(버전 계산 실패 등) claude를 띄우지 않고 실패로 끝낸다(fail-closed).
#
# 필요한 설정 (네 단계 워크플로 공통)
#   environment llm-claude의 secret CLAUDE_CODE_OAUTH_TOKEN   Claude Code OAuth 토큰(`claude setup-token`으로 발급)
#                                     레포 secret에는 두지 않는다 — README 「모델 키 격리」. Deployment branches는 main만.
#   vars.HOMELAB_K3S_MCP_URL          (선택) 기본 https://homelab-k3s-mcp.llkm.nl/mcp
#   vars.HOMELAB_K3S_MCP_AUDIENCE     (선택) 서버 MCP_GITHUB_OIDC_AUDIENCE, 기본 homelab-k3s-mcp
#   vars.CLAUDE_CODE_VERSION          (선택) stable(기본) | latest | 고정 버전
#   vars.CLAUDE_MODEL                 (선택) 기본 모델. 워크플로 입력 model이 우선
#   서버 MCP_GITHUB_OIDC_RULES에 이 워크플로 파일(reconciler-drift-detector-claude.yml) 규칙:
#     github_app_installation_token(필수 — 대상 레포·plugin-marketplace 토큰. githubToken 상한에 reconciler는 넣지 않는다),
#     resource_list, resource_get, api_resources(권장 — kubernetes 데이터 소스 관측),
#     pocket_aide_notification_send(권장 — Claude 사용 한도 초과로 중단되면 푸시)
#   GitHub App 설치 범위에 dlddu/plugin-marketplace(read)가 있어야 플러그인을 설치할 수 있다.
name: "Reconciler · Drift Detector (Claude Code)"

on:
  workflow_dispatch:
    inputs:
      target_id:
        description: "감지할 대상 지목(tbm_... 모델 또는 rct_... assessing task). 비우면 자동 선정"
        required: false
        default: ""
      model:
        description: "Claude 모델 override(예: claude-opus-5-5, opus). 비우면 vars.CLAUDE_MODEL 또는 계정 기본값"
        required: false
        default: ""

# 같은 스킬이 동시에 두 번 돌며 같은 task를 점유하거나 push가 충돌하지 않도록 직렬화한다.
# 그룹은 기존(MiniMax) 워크플로와 따로 둔다 — 같은 그룹이면 대기 중인 실행이 서로를 취소한다.
# (로컬 러너·MiniMax 워크플로와의 경쟁은 스킬의 compare-and-set 점유 커밋이 막는다.)
concurrency:
  group: reconciler-drift-detector-claude
  cancel-in-progress: false

permissions:
  contents: read

env:
  SKILL_NAME: reconciler-drift-detector
  MCP_URL: ${{ vars.HOMELAB_K3S_MCP_URL || 'https://homelab-k3s-mcp.llkm.nl/mcp' }}
  MCP_AUDIENCE: ${{ vars.HOMELAB_K3S_MCP_AUDIENCE || 'homelab-k3s-mcp' }}

jobs:
  run:
    name: Run reconciler-drift-detector
    runs-on: ubuntu-latest
    environment: llm-claude # 모델 키는 이 environment에만 있다(README 「모델 키 격리」)
    timeout-minutes: 60
    permissions:
      contents: write # 스킬의 점유·기록 커밋 push(워크플로 토큰은 .github/workflows를 못 바꾼다)
      id-token: write # homelab-k3s-mcp OIDC
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false

      # 스킬이 점유·기록할 reconciler(운영 데이터는 기본 브랜치가 진실이다). 워크플로 토큰을 남겨 스킬이 push에 쓴다.
      # 스킬(reconciler-repo-access Step 1)은 checkout이 있으면 클론하지 않고 pull --rebase만 한다.
      - name: Checkout reconciler (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: ws/reconciler
          fetch-depth: 50

      - name: Prepare output
        run: |
          echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/out/logs"

      # 읽기 토큰을 요청할 대상 레포 — ToBeModel 데이터 소스에서(reconciler 제외).
      - name: Target repositories
        id: targets
        run: echo "names=$(python3 harness/.github/scripts/target_repositories.py ws/reconciler)" >> "$GITHUB_OUTPUT"

      # OIDC 프록시 + 사전 점검 + SOURCE_GITHUB_TOKEN(대상 레포 read) 발급.
      - name: Connect homelab-k3s-mcp
        id: mcp
        uses: ./harness/.github/actions/homelab-mcp
        with:
          harness-dir: ${{ github.workspace }}/harness
          url: ${{ env.MCP_URL }}
          audience: ${{ env.MCP_AUDIENCE }}
          log-dir: ${{ runner.temp }}/out/logs
          read-token-repositories: ${{ steps.targets.outputs.names }}
          recommended-tools: resource_list resource_get api_resources pocket_aide_notification_send

      # 스킬 Step 0(대상 선정 · 진입 게이트)을 그대로 옮긴 읽기 전용 선정. 우선순위:
      # 지목 → 재확인 만료(assessing + recheckAfter 경과) → 수동 트리거 → 버전 변화(오래 관측 안 된 모델부터).
      # 비활성 모델과 열린 assessing이 있는 모델은 제외한다. 레포에 쓰지 않는다 — 점유 커밋은 스킬 Step 1 몫.
      # 대상 레포(private) 클론에는 앞 스텝이 $GITHUB_ENV로 내보낸 SOURCE_GITHUB_TOKEN을 쓴다.
      # 대상이 없는데 일부 모델의 버전 계산이 실패하면 "감지할 것 없음"으로 단정할 수 없어 실패로 끝낸다.
      - name: Select target
        id: select
        env:
          INPUT_TARGET_ID: ${{ inputs.target_id }}
        run: |
          args=(--repo ws/reconciler --target "$INPUT_TARGET_ID"
                --work-dir "$RUNNER_TEMP/select-target"
                --summary-file "$OUT/logs/select-target.md")
          python3 harness/.github/scripts/select_drift_target.py "${args[@]}"

      - name: Run skill (Claude Code)
        if: steps.select.outputs.found == 'true'
        uses: ./harness/.github/actions/run-claude-skill
        with:
          skill: ${{ env.SKILL_NAME }}
          harness-dir: ${{ github.workspace }}/harness
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          checkout-dir: ${{ github.workspace }}/ws/reconciler
          default-branch: ${{ github.event.repository.default_branch }}
          mcp-local-url: ${{ steps.mcp.outputs.local-url }}
          out-dir: ${{ runner.temp }}/out
          target-id: ${{ inputs.target_id }}
          model: ${{ inputs.model || vars.CLAUDE_MODEL }}
          claude-version: ${{ vars.CLAUDE_CODE_VERSION || 'stable' }}
          timeout: 50m
          target-label: ${{ steps.select.outputs.target_id }}${{ steps.select.outputs.model_id && format(' ({0})', steps.select.outputs.model_id) || '' }}
          artifact-name: drift-detector-claude-run

      - name: Summary
        if: always()
        env:
          TARGET_ID: ${{ steps.select.outputs.target_id }}
          TARGET_KIND: ${{ steps.select.outputs.target_kind }}
          FOUND: ${{ steps.select.outputs.found }}
          REASON: ${{ steps.select.outputs.reason }}
        run: |
          {
            echo "### 대상 선정"
            echo "- target found: ${FOUND:-false}"
            echo "- target_id: ${TARGET_ID:-<none>}${TARGET_KIND:+ ($TARGET_KIND)}${REASON:+ · $REASON}"
            [ "$FOUND" = "true" ] || echo "- claude 실행 안 함(감지 후보 없음 또는 게이트 실패)"
            echo
            cat "$OUT/logs/select-target.md" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
