# 리뷰 단계 — reconciler-work-review 스킬 실행
# planned task 한 건을 reviewing으로 점유해 승인/거부를 판정한다.
# 뼈대만 있음: 실제 스킬 실행 로직은 "Run skill" 스텝에 구현한다.
name: "Reconciler · Work Review"

on:
  workflow_dispatch:
    inputs:
      target_id:
        description: "판정할 대상 지목(tbm_.../rct_... 또는 rct_... planned task, tbm_... 모델). 비우면 자동 선정"
        required: false
        default: ""

# concurrency 그룹을 두지 않는다 — 같은 워크플로를 여러 번 띄우면 병렬로 돈다.
# 같은 task 중복 점유·push 충돌은 스킬의 status compare-and-set 점유 커밋(pull --rebase → 상태 재확인 →
# 점유 push, 지면 물러남)이 막는다. 로컬 러너·다른 제공자 워크플로와의 경쟁도 같은 규약으로 막는다.

permissions:
  contents: write
  id-token: write # OIDC 토큰 발급

jobs:
  run:
    name: Run reconciler-work-review
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SKILL_NAME: reconciler-work-review
    steps:
      - name: Checkout reconciler
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # TODO: OIDC 토큰 발급 (audience 지정 후 필요한 자격 증명으로 교환)
      - name: Request OIDC token
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL" && test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            || { echo "OIDC 토큰 요청 환경이 없습니다 (id-token: write 권한 확인)"; exit 1; }
          echo "TODO: request OIDC token for $SKILL_NAME"

      # TODO: 스킬 실행에 필요한 런타임·CLI·자격 증명 준비 (예: Python, 대상 레포 토큰, 클러스터 접근)
      - name: Set up runtime
        run: |
          echo "TODO: set up runtime for $SKILL_NAME"

      # 스킬 Step 0(대상 선정 · 진입 게이트, 4-0)을 옮긴 읽기 전용 선정. reconciler-local의 리뷰어
      # 게이트(precheck-review.py: status planned)에 claim.py의 review 전제(마지막 attempt의
      # plan.steps·executionGuide·preparation)를 더해, 점유가 튕기지 않을 task만 고른다.
      # 우선순위: 지목 → 오래 기다린 planned(updatedAt). reviewing(남의 lock)·approved 등은 고르지 않는다.
      # 레포에 쓰지 않고 대상 레포에도 접근하지 않는다 — 점유는 스킬 Step 1, PR 신선도는 Step 2 몫.
      # 대상이 없는데 전제가 깨진 planned가 있으면 막힌 task를 드러내려고 실패로 끝낸다.
      - name: Select target
        id: select
        env:
          INPUT_TARGET_ID: ${{ inputs.target_id }}
        run: |
          python3 .github/scripts/select_review_target.py \
            --repo "$GITHUB_WORKSPACE" --target "$INPUT_TARGET_ID" \
            --summary-file "$RUNNER_TEMP/select-target.md"

      # TODO: 고른 대상에 대해 스킬 실행.
      - name: Run skill
        if: steps.select.outputs.found == 'true'
        env:
          TARGET_ID: ${{ steps.select.outputs.target_id }}
          MODEL_ID: ${{ steps.select.outputs.model_id }}
          SELECT_REASON: ${{ steps.select.outputs.reason }}
          PULL_REQUEST_URL: ${{ steps.select.outputs.pull_request_url }}
        run: |
          echo "skill:     $SKILL_NAME"
          echo "target_id: $MODEL_ID/$TARGET_ID ($SELECT_REASON)"
          echo "pr:        ${PULL_REQUEST_URL:-<direct action>}"
          echo "TODO: implement $SKILL_NAME execution"

      - name: Summary
        if: always()
        env:
          TARGET_ID: ${{ steps.select.outputs.target_id }}
          MODEL_ID: ${{ steps.select.outputs.model_id }}
          FOUND: ${{ steps.select.outputs.found }}
          REASON: ${{ steps.select.outputs.reason }}
        run: |
          {
            echo "### $SKILL_NAME"
            echo "- target found: ${FOUND:-false}"
            echo "- target_id: ${TARGET_ID:-<none>}${MODEL_ID:+ (model $MODEL_ID)}${REASON:+, $REASON}"
            echo "- result: TODO"
            echo
            cat "$RUNNER_TEMP/select-target.md" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
