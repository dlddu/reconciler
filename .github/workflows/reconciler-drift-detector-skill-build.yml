# 감지 스킬 빌드 — MiniMax Code(mcode)로 reconciler-drift-detector 스킬을 생성 → 검증한다.
#
# 스킬 생성은 자동화 대상이 아니다: 지침(.github/minimax/drift-detector-brief*.md)이나 계약을 바꿀 때 사람이
# 수동으로 돌리고, 통과한 생성본(drift-detector-skill 아티팩트)을 plugin-marketplace의
# plugins/reconciler-data-plane 에 PR로 올린다. 스케줄 감지는 reconciler-drift-detector.yml 이 그 고정 패키지로 돈다.
#
#   generate  지침만 주고 mcode가 레포를 직접 읽어 SKILL.md를 작성한다. 기존 스킬 본문은 모델에 노출하지 않는다.
#             지침 = 메인(drift-detector-brief.md, 핵심 규칙 — 무엇을 해야 하나) + 서브(drift-detector-brief-sub.md,
#             품질 보조 규칙 — 어떻게, 무엇을 하지 말 것). 둘을 이 순서로 이어 한 프롬프트로 준다.
#   validate  생성물 정적 검증(형식 · 계약 커버리지 · 금지 패턴 · 보조 스크립트 문법).
#
# 필요한 설정
#   environment llm-minimax의 secret MINIMAX_SUBSCRIPTION_KEY   MiniMax Token Plan subscription key (sk-cp-...)
#                                      레포 secret에는 두지 않는다 — README 「모델 키 격리」
#   vars.MINIMAX_REGION                (선택) en(기본, api.minimax.io) | cn
name: "Reconciler · Drift Detector Skill Build"

on:
  workflow_dispatch:
    inputs:
      minimax_model:
        description: "mcode 모델 override(<provider>/<model>, 예: minimax/MiniMax-M3). 비우면 CLI 기본값"
        required: false
        default: ""

# 빌드끼리 직렬화한다.
concurrency:
  group: reconciler-drift-detector-skill-build
  cancel-in-progress: false

permissions:
  contents: read

env:
  SKILL_NAME: reconciler-drift-detector
  SKILL_REL: .agents/skills/reconciler-drift-detector # mcode 워크스페이스(ws/) 기준 스킬 위치
  MCODE_VERSION: latest # npm dist-tag — 실제 설치된 버전은 Set up MiniMax Code 출력·요약에 남는다

jobs:
  generate:
    name: Generate skill (MiniMax Code)
    runs-on: ubuntu-latest
    environment: llm-minimax # 모델 키는 이 environment에만 있다(README 「모델 키 격리」)
    timeout-minutes: 30
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false

      # mcode 워크스페이스: ws/ 아래에 reconciler(읽기 참고용)와 스킬 출력 위치를 둔다.
      # 스킬을 레포 밖(ws/.agents)에 쓰게 해 reconciler 체크아웃을 오염시키지 않는다.
      - name: Checkout reconciler (reference)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: ws/reconciler
          persist-credentials: false

      - name: Set up MiniMax Code
        uses: ./harness/.github/actions/setup-mcode
        with:
          subscription-key: ${{ secrets.MINIMAX_SUBSCRIPTION_KEY }}
          version: ${{ env.MCODE_VERSION }}
          region: ${{ vars.MINIMAX_REGION || 'en' }}

      - name: Generate SKILL.md
        id: gen
        env:
          MODEL: ${{ inputs.minimax_model }}
        run: |
          out="$RUNNER_TEMP/out"; mkdir -p "$out/logs" "$GITHUB_WORKSPACE/ws/$SKILL_REL"
          for f in drift-detector-brief.md drift-detector-brief-sub.md; do
            test -f "harness/.github/minimax/$f" || { echo "::error::지침 파일 없음: $f"; exit 1; }
          done
          {
            cat harness/.github/minimax/drift-detector-brief.md
            printf '\n\n---\n\n'
            cat harness/.github/minimax/drift-detector-brief-sub.md
          } | sed -e "s#{{SKILL_DIR}}#$SKILL_REL#g" -e "s#{{REPO_DIR}}#./reconciler#g" > "$out/logs/prompt.md"
          echo "brief: $(wc -c < "$out/logs/prompt.md") bytes"
          args=(exec --input - --cwd "$GITHUB_WORKSPACE/ws" --permission full
                --output-format stream-json --timeout 25m
                --output-last-message "$out/logs/final-message.md"
                --diagnostics-dir "$out/logs/diagnostics")
          [ -n "$MODEL" ] && args+=(--model "$MODEL")
          set +e
          env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
            mcode "${args[@]}" < "$out/logs/prompt.md" > "$out/logs/transcript.jsonl" 2> "$out/logs/stderr.log"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 5 "$out/logs/stderr.log" || true
          [ "$code" -eq 0 ] || { echo "::error::mcode 생성 실행 실패(exit $code) — logs/stderr.log 참고"; exit "$code"; }

      - name: Check reference checkout untouched
        run: |
          changes=$(git -C ws/reconciler status --porcelain)
          if [ -n "$changes" ]; then
            echo "::error::생성 단계가 reconciler 체크아웃을 수정함"; echo "$changes"; exit 1
          fi
          test -f "ws/$SKILL_REL/SKILL.md" || { echo "::error::SKILL.md가 생성되지 않음"; exit 1; }

      - name: Collect skill
        if: always()
        run: |
          out="$RUNNER_TEMP/out"; mkdir -p "$out/skill"
          cp -R "ws/$SKILL_REL/." "$out/skill/" 2>/dev/null || true
          {
            echo "### 1. Generate"
            echo "- mcode ${MCODE_INSTALLED_VERSION:-<미설치>} · exit: ${{ steps.gen.outputs.exit_code || 'n/a' }}"
            echo "- 생성 파일: $(cd "$out/skill" && find . -type f | sed 's#^\./##' | paste -sd ', ' -)"
            python3 harness/.github/scripts/mcode_transcript.py summary "$out/logs/transcript.jsonl" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      # 대화 기록에는 도구 결과로 받은 토큰이 남을 수 있다 — 올리기 전에 가린다.
      - name: Redact secrets
        if: always()
        run: python3 harness/.github/scripts/redact_secrets.py "$RUNNER_TEMP/out"

      - name: Upload skill artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-detector-skill
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
          retention-days: 14

  validate:
    name: Validate skill
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
          sparse-checkout: .github

      - name: Download skill
        uses: actions/download-artifact@v4
        with:
          name: drift-detector-skill
          path: ${{ runner.temp }}/gen

      - name: Static validation
        run: |
          mkdir -p "$RUNNER_TEMP/validation"
          set +e
          python3 harness/.github/scripts/validate_generated_skill.py "$RUNNER_TEMP/gen/skill" \
            --report "$RUNNER_TEMP/validation/report.md" --json "$RUNNER_TEMP/validation/report.json"
          code=$?
          set -e
          cat "$RUNNER_TEMP/validation/report.md" >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-detector-validation
          path: ${{ runner.temp }}/validation
          if-no-files-found: warn
          retention-days: 14
