# GitHub Pages 배포 — 데이터 브라우저(index.html + data/)를 GitHub Actions 방식으로 배포한다.
# path 필터: 서빙되는 파일이 바뀔 때만 실행한다 (README 등 그 외 변경은 배포 생략).
name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - 'data/**'
      - 'schemas/**'
      - .nojekyll
      - .github/workflows/deploy-pages.yml
  # Actions 탭에서 수동 실행 허용
  workflow_dispatch:

# Pages 배포에 필요한 GITHUB_TOKEN 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포는 1개만. 진행 중인 배포는 취소하지 않고,
# 그 사이 쌓인 큐는 최신 1개만 남는다 (데이터 커밋이 잦아도 배포가 몰리지 않음).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 루트 전체 업로드 (.git / .github 은 액션이 자동 제외)
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
