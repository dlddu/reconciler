# 데이터 브라우저(index.html) 배포 — README 「데이터 브라우저」.
#
# 페이지는 data/·templates/를 raw.githubusercontent.com의 main에서 읽으므로 Pages에는 index.html 하나만 올린다.
# 그래서 봇의 데이터 커밋(시간당 수십 개)마다 Pages를 다시 배포하지 않고, 페이지 자체가 바뀔 때만 배포한다.
# (예전 「Deploy from a branch」는 main 커밋마다 레포 전체를 다시 배포했다 — 2026-11-03 하루 134회.)
#
# 필요한 설정: Settings → Pages → Build and deployment → Source: GitHub Actions
name: "Pages"

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# 배포가 겹치면 뒤의 것만 남긴다(진행 중인 배포는 끝까지 둔다).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy index.html
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: index.html
          sparse-checkout-cone-mode: false

      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
