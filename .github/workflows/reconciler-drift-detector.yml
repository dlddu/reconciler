# 감지 단계 — 러너가 대상을 고르고 점유한 뒤, plugin-marketplace의 고정 MiniMax 스킬
# (plugins/reconciler-data-plane, reconciler-drift-detector)로 그 task 한 건을 판정한다.
#
# 스킬은 여기서 만들지 않는다. 생성 → 검증 → 테스트는 reconciler-drift-detector-skill-build.yml(수동 실행)의 몫이고,
# 통과한 생성본이 plugin-marketplace에 올라간 것만 쓴다(README 「감지 스킬 MiniMax 파이프라인」).
# 대상 선정·점유는 claim_drift_target.py(README 「점유는 러너가 한다」), 스킬은 판정만.
#
# 점유·판정 커밋을 기본 브랜치에 push한다(contents: write).
#
# 필요한 설정
#   environment llm-minimax의 secret MINIMAX_SUBSCRIPTION_KEY   MiniMax Token Plan subscription key (sk-cp-...)
#                                      레포 secret에는 두지 않는다 — README 「모델 키 격리」
#   vars.HOMELAB_K3S_MCP_URL / vars.HOMELAB_K3S_MCP_AUDIENCE / vars.MINIMAX_REGION  (선택)
#   서버 MCP_GITHUB_OIDC_RULES에 이 파일(.github/workflows/reconciler-drift-detector.yml) 규칙:
#     github_app_installation_token(필수 — 대상 레포와 plugin-marketplace 읽기), resource_list, resource_get,
#     api_resources, ping(권장), pocket_aide_notification_send(circuit-breaker 알림)
#   GitHub App이 plugin-marketplace(private)에 설치돼 있어야 한다.
name: "Reconciler · Drift Detector"

on:
  # ── 스케줄 트리거 (아직 끔) ──────────────────────────────────────────────────────────
  # 스케줄은 감지만 돈다(이 파일에 스킬 생성은 없다). 켤 때 아래 circuit-breaker job 주석도 함께 푼다
  # (스케줄 실행이 연속 실패하면 이 워크플로를 스스로 끈다).
  # 주기는 실행 시간(판정 6~8분)과 concurrency 직렬화를 보고 정한다. :00 정각은 GitHub 스케줄이 몰려 지연되기
  # 쉬우니 피한다.
  # schedule:
  #   - cron: "17 * * * *"   # 매시 17분(UTC)
  workflow_dispatch:
    inputs:
      target_id:
        description: "감지할 대상 지목(tbm_... 모델 또는 rct_... assessing task). 비우면 자동 선정"
        required: false
        default: ""
      reason:
        description: "지목한 모델의 버전이 그대로일 때 manual task에 남길 사유(비우면 '워크플로 지목 감지 요청')"
        required: false
        default: ""
      plugin_ref:
        description: "plugin-marketplace에서 가져올 ref(브랜치·태그·SHA). 비우면 main"
        required: false
        default: ""
      minimax_model:
        description: "mcode 모델 override(<provider>/<model>). 비우면 CLI 기본값"
        required: false
        default: ""

# 같은 대상을 두 실행이 동시에 점유하지 않도록 직렬화한다.
concurrency:
  group: reconciler-drift-detector
  cancel-in-progress: false

permissions:
  contents: write

env:
  PLUGIN_NAME: reconciler-data-plane
  SKILL_NAME: reconciler-drift-detector
  MCODE_VERSION: latest # npm dist-tag — 실제 설치된 버전은 Set up MiniMax Code 출력·요약에 남는다
  MCP_URL: ${{ vars.HOMELAB_K3S_MCP_URL || 'https://homelab-k3s-mcp.llkm.nl/mcp' }}
  MCP_AUDIENCE: ${{ vars.HOMELAB_K3S_MCP_AUDIENCE || 'homelab-k3s-mcp' }}
  MCP_PROXY_PORT: "8765"

jobs:
  detect:
    name: Claim and judge
    runs-on: ubuntu-latest
    environment: llm-minimax # 모델 키는 이 environment에만 있다(README 「모델 키 격리」)
    timeout-minutes: 60
    permissions:
      contents: write # 점유·판정 커밋 push
      id-token: write # homelab-k3s-mcp OIDC
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false

      - name: Checkout reconciler (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: ws/reconciler
          fetch-depth: 50

      - name: Prepare workspace
        run: |
          OUT="$RUNNER_TEMP/out"; echo "OUT=$OUT" >> "$GITHUB_ENV"
          mkdir -p "$OUT/logs"
          git -C ws/reconciler config user.name "reconciler-bot"
          git -C ws/reconciler config user.email "reconciler@dlddu.dev"
          pip install --quiet --disable-pip-version-check jsonschema

      - name: Start homelab-k3s-mcp OIDC proxy
        run: |
          nohup python3 harness/.github/scripts/mcp_oidc_proxy.py --upstream "$MCP_URL" \
            --audience "$MCP_AUDIENCE" --port "$MCP_PROXY_PORT" > "$OUT/logs/mcp-proxy.log" 2>&1 &
          for _ in $(seq 1 30); do
            grep -q listening "$OUT/logs/mcp-proxy.log" && break
            if ! kill -0 $! 2>/dev/null; then cat "$OUT/logs/mcp-proxy.log"; echo "::error::프록시 기동 실패"; exit 1; fi
            sleep 1
          done
          echo "MCP_LOCAL_URL=http://127.0.0.1:$MCP_PROXY_PORT/mcp" >> "$GITHUB_ENV"

      - name: MCP preflight (tools/list)
        run: |
          # 서버가 재시작·기동 중(sablier cold start)이면 첫 요청이 실패할 수 있다 — 짧게 몇 번 다시 본다.
          for i in 1 2 3 4; do
            if python3 harness/.github/scripts/mcp_call.py --url "$MCP_LOCAL_URL" tools --json > "$OUT/logs/mcp-tools.json"; then
              echo "tools: $(cat "$OUT/logs/mcp-tools.json")"; exit 0
            fi
            [ "$i" -lt 4 ] && { echo "MCP 응답 없음 — $((i * 20))초 뒤 재시도($i/3)"; sleep $((i * 20)); }
          done
          cat "$OUT/logs/mcp-proxy.log"
          echo "::error::homelab-k3s-mcp 호출 실패 — audience나 서버 MCP_GITHUB_OIDC_RULES의 이 워크플로 규칙을 확인"
          exit 1

      # 대상 레포 클론용 읽기 토큰(선정·점유 스크립트 전용, mcode 환경에서는 뺀다).
      - name: Mint source read token
        run: python3 harness/.github/scripts/mcp_call.py --url "$MCP_LOCAL_URL" github-token --env-name SOURCE_GITHUB_TOKEN

      - name: Claim target
        id: claim
        env:
          INPUT_TARGET_ID: ${{ inputs.target_id }}
          INPUT_REASON: ${{ inputs.reason }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          args=(--repo ws/reconciler --branch "$DEFAULT_BRANCH" --target "$INPUT_TARGET_ID" --reason "$INPUT_REASON"
                --work-dir "$RUNNER_TEMP/select-target" --summary-file "$OUT/logs/claim.md")
          python3 harness/.github/scripts/claim_drift_target.py "${args[@]}"

      # 고정 스킬: plugin-marketplace(private)의 plugins/<PLUGIN_NAME>을 mcode 로컬 플러그인으로 설치한다.
      - name: Fetch plugin package
        if: steps.claim.outputs.claimed == 'true'
        id: plugin
        env:
          PLUGIN_REF: ${{ inputs.plugin_ref || 'main' }}
        run: |
          python3 harness/.github/scripts/mcp_call.py --url "$MCP_LOCAL_URL" github-token \
            --env-name MARKETPLACE_TOKEN --repositories plugin-marketplace
          echo "ref=$PLUGIN_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout plugin-marketplace
        if: steps.claim.outputs.claimed == 'true'
        uses: actions/checkout@v4
        with:
          repository: dlddu/plugin-marketplace
          ref: ${{ steps.plugin.outputs.ref }}
          token: ${{ env.MARKETPLACE_TOKEN }}
          path: marketplace
          persist-credentials: false
          sparse-checkout: |
            plugins/${{ env.PLUGIN_NAME }}

      - name: Set up MiniMax Code
        if: steps.claim.outputs.claimed == 'true'
        uses: ./harness/.github/actions/setup-mcode
        with:
          subscription-key: ${{ secrets.MINIMAX_SUBSCRIPTION_KEY }}
          version: ${{ env.MCODE_VERSION }}
          region: ${{ vars.MINIMAX_REGION || 'en' }}

      - name: Install plugin into mcode
        if: steps.claim.outputs.claimed == 'true'
        id: install
        run: |
          src="marketplace/plugins/$PLUGIN_NAME"
          test -f "$src/.minimax-plugin/plugin.json" || { echo "::error::$src 에 MiniMax 플러그인이 없음"; exit 1; }
          mkdir -p "$MINIMAX_DATA_DIR/plugins"
          cp -R "$src" "$MINIMAX_DATA_DIR/plugins/$PLUGIN_NAME"
          mcode plugin list --available --marketplace local --json > "$OUT/logs/plugins.json"
          python3 - "$OUT/logs/plugins.json" <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          name = os.environ["PLUGIN_NAME"]
          found = [p for p in json.load(open(sys.argv[1]))["installed"] if p["name"] == name]
          if not (found and found[0].get("enabled") and found[0]["capabilities"]["skillCount"] >= 1):
              sys.exit(f"::error::mcode가 {name} 플러그인을 인식하지 못함")
          print(f"version={found[0]['version']}")
          PY
          echo "commit=$(git -C marketplace rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "SKILL_DIR=$MINIMAX_DATA_DIR/plugins/$PLUGIN_NAME/skills/$SKILL_NAME" >> "$GITHUB_ENV"
          printf '{"mcpServers":{"k3s":{"type":"http","url":"%s"}}}\n' "$MCP_LOCAL_URL" > ws/.mcp.json

      - name: Run skill
        id: run
        if: steps.claim.outputs.claimed == 'true'
        env:
          MODEL: ${{ inputs.minimax_model }}
          TASK_ID: ${{ steps.claim.outputs.task_id }}
          MODEL_ID: ${{ steps.claim.outputs.model_id }}
          CLAIM_REASON: ${{ steps.claim.outputs.claim_reason }}
          CLAIM_COMMIT: ${{ steps.claim.outputs.claim_commit }}
        run: |
          test "$(git -C ws/reconciler rev-parse HEAD)" = "$CLAIM_COMMIT"
          echo "base=$CLAIM_COMMIT" >> "$GITHUB_OUTPUT"
          sed -e "s#{{SKILL_DIR}}#$SKILL_DIR#g" -e "s#{{REPO_DIR}}#./reconciler#g" \
              -e "s#{{TASK_ID}}#$TASK_ID#g" -e "s#{{MODEL_ID}}#$MODEL_ID#g" \
              -e "s#{{CLAIM_REASON}}#$CLAIM_REASON#g" -e "s#{{CLAIM_COMMIT}}#$CLAIM_COMMIT#g" \
              harness/.github/minimax/drift-detector-run-prompt.md > "$OUT/logs/prompt.md"
          args=(exec --input - --cwd "$GITHUB_WORKSPACE/ws" --permission full
                --output-format stream-json --timeout 40m
                --output-last-message "$OUT/logs/final-message.md"
                --diagnostics-dir "$OUT/logs/diagnostics")
          [ -n "$MODEL" ] && args+=(--model "$MODEL")
          set +e
          env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
            -u SOURCE_GITHUB_TOKEN -u MARKETPLACE_TOKEN \
            mcode "${args[@]}" < "$OUT/logs/prompt.md" > "$OUT/logs/transcript.jsonl" 2> "$OUT/logs/stderr.log"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 5 "$OUT/logs/stderr.log" || true
          [ "$code" -eq 0 ] || echo "::warning::mcode가 exit $code로 끝남 — 결과 점검은 계속한다"

      # 판정이 계약대로 기록됐는지 확인한다(점유 이후 그 task 파일만 바뀜, 점유 기록 보존, 종료 상태).
      - name: Check result
        if: steps.run.outcome != 'skipped' && steps.run.outputs.base != ''
        env:
          TASK_ID: ${{ steps.claim.outputs.task_id }}
          MODEL_ID: ${{ steps.claim.outputs.model_id }}
          CLAIM_MESSAGE: ${{ steps.claim.outputs.claim_message }}
          BASE: ${{ steps.run.outputs.base }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set +e
          python3 harness/.github/scripts/check_detector_result.py --repo ws/reconciler --base "$BASE" \
            --model-id "$MODEL_ID" --task-id "$TASK_ID" --claim-subject "$CLAIM_MESSAGE" \
            --report "$OUT/check-report.md" --json "$OUT/check-report.json" --patch "$OUT/result.patch"
          code=$?
          set -e
          git -C ws/reconciler format-patch --stdout "origin/$DEFAULT_BRANCH..HEAD" > "$OUT/commits.patch" || true
          exit $code

      - name: Summary
        if: always()
        env:
          CLAIMED: ${{ steps.claim.outputs.claimed }}
          TASK_ID: ${{ steps.claim.outputs.task_id }}
          REASON: ${{ steps.claim.outputs.claim_reason }}
          LOST: ${{ steps.claim.outputs.lost_count }}
          PLUGIN_VERSION: ${{ steps.install.outputs.version }}
          PLUGIN_COMMIT: ${{ steps.install.outputs.commit }}
          RUN_EXIT: ${{ steps.run.outputs.exit_code }}
        run: |
          {
            echo "### reconciler-drift-detector"
            echo "- 점유: ${CLAIMED:-false} · task: ${TASK_ID:-<none>}${REASON:+ ($REASON)} · 경쟁 패배 ${LOST:-0}건"
            [ -n "$PLUGIN_VERSION" ] && echo "- 스킬: $PLUGIN_NAME $PLUGIN_VERSION (plugin-marketplace \`${PLUGIN_COMMIT:0:7}\`)"
            echo "- mcode ${MCODE_INSTALLED_VERSION:-<미설치>} · exit: ${RUN_EXIT:-n/a}"
            if [ -s "$OUT/logs/transcript.jsonl" ]; then
              python3 harness/.github/scripts/mcode_transcript.py summary "$OUT/logs/transcript.jsonl"
            fi
            echo
            cat "$OUT/logs/claim.md" 2>/dev/null || true
            echo
            cat "$OUT/check-report.md" 2>/dev/null || true
            if [ -s "$OUT/logs/final-message.md" ]; then
              echo; echo "<details><summary>mcode 최종 보고</summary>"; echo
              head -c 6000 "$OUT/logs/final-message.md"; echo; echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Redact secrets
        if: always()
        run: python3 harness/.github/scripts/redact_secrets.py "$RUNNER_TEMP/out" --extra-env SOURCE_GITHUB_TOKEN --extra-env MARKETPLACE_TOKEN

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-detector-result
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
          retention-days: 14

  # ── 연속 실패 시 자동 비활성화 (스케줄을 켤 때 함께 주석 해제) ───────────────────────────
  # GitHub는 실패 횟수로 워크플로를 끄지 않는다(스케줄 워크플로는 레포 활동 60일 없음일 때만 자동 비활성).
  # 그래서 스케줄 실행이 실패하면 이 job이 최근 스케줄 실행을 세어, FAILURE_THRESHOLD번 연속 실패면
  # 이 워크플로를 끄고(gh workflow disable) PocketAide로 알린다.
  #   - 실패로 세는 것: 결론이 failure인 스케줄 실행(MCP 연결·MiniMax 오류·점유 오류·결과 점검 실패).
  #     대상 없음·점유 경쟁 패배는 성공으로 끝나므로 세지 않는다.
  #   - workflow_dispatch(수동 실행)는 세지 않는다. 중간에 성공이나 취소가 한 번이라도 있으면 거기서 끊긴다.
  #   - 다시 켜기: Actions 화면의 Enable workflow 또는 `gh workflow enable reconciler-drift-detector.yml`.
  #   - 알림은 homelab-k3s-mcp OIDC 규칙(SSM /flux-cd/homelab-k3s-mcp/github-oidc, v5~)의 이 워크플로 규칙에 있는
  #     pocket_aide_notification_send로 보낸다. 알림이 실패해도 비활성화는 이미 끝난 뒤다.
