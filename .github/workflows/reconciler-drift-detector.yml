# 감지 단계 — reconciler-drift-detector 스킬 실행
# 버전이 바뀐(또는 수동 트리거된) ToBeModel 한 건을 assessing으로 점유해 as-is/to-be 차이와 작업 필요 여부를 판정한다.
# 뼈대만 있음: 실제 스킬 실행 로직은 "Run skill" 스텝에 구현한다.
name: "Reconciler · Drift Detector"

on:
  workflow_dispatch:
    inputs:
      target_id:
        description: "감지할 대상 지목(tbm_... 모델 또는 rct_... assessing task). 비우면 자동 선정"
        required: false
        default: ""

# 같은 스킬이 동시에 두 번 돌며 같은 task를 점유하거나 push가 충돌하지 않도록 직렬화한다.
concurrency:
  group: reconciler-drift-detector
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # OIDC 토큰 발급

jobs:
  run:
    name: Run reconciler-drift-detector
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SKILL_NAME: reconciler-drift-detector
    steps:
      - name: Checkout reconciler
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # TODO: OIDC 토큰 발급 (audience 지정 후 필요한 자격 증명으로 교환)
      - name: Request OIDC token
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL" && test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            || { echo "OIDC 토큰 요청 환경이 없습니다 (id-token: write 권한 확인)"; exit 1; }
          echo "TODO: request OIDC token for $SKILL_NAME"

      # TODO: 스킬 실행에 필요한 런타임·CLI·자격 증명 준비 (예: Python, 대상 레포 토큰, 클러스터 접근)
      - name: Set up runtime
        run: |
          echo "TODO: set up runtime for $SKILL_NAME"

      # 스킬 Step 0(대상 선정 · 진입 게이트)을 그대로 옮긴 읽기 전용 선정. 우선순위:
      # 지목 → 재확인 만료(assessing + recheckAfter 경과) → 수동 트리거 → 버전 변화(오래 관측 안 된 모델부터).
      # 비활성 모델과 열린 assessing이 있는 모델은 제외한다. 레포에 쓰지 않는다 — 점유 커밋은 스킬 Step 1 몫.
      # 대상 레포(private) 클론에는 앞 스텝이 $GITHUB_ENV로 내보낸 SOURCE_GITHUB_TOKEN을 쓴다(없으면 익명 클론).
      # 대상이 없는데 일부 모델의 버전 계산이 실패하면 "감지할 것 없음"으로 단정할 수 없어 실패로 끝낸다.
      - name: Select target
        id: select
        env:
          INPUT_TARGET_ID: ${{ inputs.target_id }}
        run: |
          args=(--repo "$GITHUB_WORKSPACE" --target "$INPUT_TARGET_ID"
                --work-dir "$RUNNER_TEMP/select-target"
                --summary-file "$RUNNER_TEMP/select-target.md")
          python3 .github/scripts/select_drift_target.py "${args[@]}"

      # TODO: 고른 대상에 대해 스킬 실행.
      - name: Run skill
        if: steps.select.outputs.found == 'true'
        env:
          TARGET_ID: ${{ steps.select.outputs.target_id }}
          TARGET_KIND: ${{ steps.select.outputs.target_kind }}
          SELECT_REASON: ${{ steps.select.outputs.reason }}
        run: |
          echo "skill:     $SKILL_NAME"
          echo "target_id: $TARGET_ID ($TARGET_KIND, $SELECT_REASON)"
          echo "TODO: implement $SKILL_NAME execution"

      - name: Summary
        if: always()
        env:
          TARGET_ID: ${{ steps.select.outputs.target_id }}
          FOUND: ${{ steps.select.outputs.found }}
          REASON: ${{ steps.select.outputs.reason }}
        run: |
          {
            echo "### $SKILL_NAME"
            echo "- target found: ${FOUND:-false}"
            echo "- target_id: ${TARGET_ID:-<none>}${REASON:+ ($REASON)}"
            echo "- result: TODO"
            echo
            cat "$RUNNER_TEMP/select-target.md" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
